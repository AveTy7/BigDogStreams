name: Dodgers Game Scraper

on:
  schedule:
    - cron: '0 12 * * *'
  workflow_dispatch: # Allows manual trigger from your phone

permissions:
  contents: write # Required so the action can save links.json back to your repo

jobs:
  run-scraper:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: Run scraper script
        run: python scraper.py

      - name: Commit and push links.json if changed
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add links.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update links.json [skip ci]" && git push)
