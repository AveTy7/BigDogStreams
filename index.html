<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sports Hub & Live Stream Matcher</title>
    <style>
        :root {
            --bg-primary: #0f172a;
            --bg-secondary: #1e293b;
            --bg-card: #1e293b;
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --accent: #38bdf8;
            --accent-hover: #0ea5e9;
            --border: #334155;
            --success: #22c55e;
            --danger: #ef4444;
            --live-pulse: #ef4444;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            background-color: var(--bg-secondary);
            border-bottom: 1px solid var(--border);
            padding: 16px 24px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .header-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
        }

        h1 {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--text-primary);
        }

        .nav-tabs {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .tab-btn {
            background-color: var(--bg-primary);
            color: var(--text-secondary);
            border: 1px solid var(--border);
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.9rem;
            transition: all 0.2s ease;
        }

        .tab-btn:hover {
            color: var(--text-primary);
            border-color: var(--text-secondary);
        }

        .tab-btn.active {
            background-color: var(--accent);
            color: var(--bg-primary);
            border-color: var(--accent);
        }

        .filter-bar {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
            visibility: hidden;
            opacity: 0;
            transition: opacity 0.2s ease;
            height: 0;
            overflow: hidden;
        }

        .filter-bar.visible {
            visibility: visible;
            opacity: 1;
            height: auto;
            margin-top: 4px;
        }

        select {
            background-color: var(--bg-primary);
            color: var(--text-primary);
            border: 1px solid var(--border);
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 0.9rem;
            outline: none;
            cursor: pointer;
        }

        select.hidden {
            display: none;
        }

        .action-btn {
            background-color: transparent;
            color: var(--accent);
            border: 1px solid var(--accent);
            padding: 6px 14px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.9rem;
            transition: all 0.2s ease;
        }

        .action-btn:hover {
            background-color: var(--accent);
            color: var(--bg-primary);
        }

        .action-btn.standings-active {
            background-color: var(--accent);
            color: var(--bg-primary);
        }

        .secondary-btn {
            background-color: transparent;
            color: var(--text-secondary);
            border: 1px solid var(--border);
            padding: 6px 14px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.9rem;
            display: none;
            transition: all 0.2s ease;
        }

        .secondary-btn.visible {
            display: inline-block;
        }

        .secondary-btn:hover {
            border-color: var(--text-primary);
            color: var(--text-primary);
        }

        .secondary-btn.active {
            border-color: var(--accent);
            color: var(--accent);
        }

        main {
            flex: 1;
            padding: 24px;
            max-width: 1400px;
            width: 100%;
            margin: 0 auto;
        }

        .loading, .error, .no-data {
            text-align: center;
            padding: 48px;
            color: var(--text-secondary);
            font-size: 1.1rem;
        }

        .error {
            color: var(--danger);
        }

        .games-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 16px;
        }

        .game-card {
            background-color: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 16px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            gap: 12px;
            cursor: pointer;
            transition: transform 0.2s ease, border-color 0.2s ease;
        }

        .game-card:hover {
            transform: translateY(-2px);
            border-color: var(--text-secondary);
        }

        .game-status-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.8rem;
            color: var(--text-secondary);
            margin-bottom: 8px;
        }

        .status-live {
            color: var(--danger);
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .pulse-dot {
            width: 8px;
            height: 8px;
            background-color: var(--danger);
            border-radius: 50%;
            display: inline-block;
            box-shadow: 0 0 0 rgba(239, 68, 68, 0.4);
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% {
                box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7);
            }
            70% {
                box-shadow: 0 0 0 6px rgba(239, 68, 68, 0);
            }
            100% {
                box-shadow: 0 0 0 0 rgba(239, 68, 68, 0);
            }
        }

        .status-final {
            color: var(--text-secondary);
            font-weight: 600;
        }

        .status-scheduled {
            color: var(--accent);
            font-weight: 600;
        }

        .teams-container {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .team-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .team-info {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .team-logo {
            width: 24px;
            height: 24px;
            object-fit: contain;
        }

        .team-name {
            font-size: 0.95rem;
            font-weight: 600;
        }

        .team-score {
            font-size: 1.1rem;
            font-weight: 700;
        }

        .card-footer {
            border-top: 1px solid var(--border);
            padding-top: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.75rem;
            color: var(--text-secondary);
        }

        .view-boxscore-hint {
            color: var(--accent);
            font-weight: 600;
        }

        .standings-section {
            background-color: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 8px;
            overflow: hidden;
            margin-bottom: 24px;
        }

        .standings-title {
            background-color: rgba(255, 255, 255, 0.02);
            padding: 14px 20px;
            font-size: 1rem;
            font-weight: 700;
            border-bottom: 1px solid var(--border);
        }

        .table-responsive {
            width: 100%;
            overflow-x: auto;
        }

        .standings-table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
            font-size: 0.9rem;
        }

        .standings-table th, .standings-table td {
            padding: 12px 20px;
            border-bottom: 1px solid var(--border);
        }

        .standings-table th {
            color: var(--text-secondary);
            font-weight: 600;
            background-color: rgba(0, 0, 0, 0.1);
        }

        .standings-table tr:last-child td {
            border-bottom: none;
        }

        .team-cell {
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 600;
        }

        .boxscore-header {
            margin-bottom: 12px;
        }

        .back-btn {
            background-color: transparent;
            color: var(--text-secondary);
            border: 1px solid var(--border);
            padding: 5px 10px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: 600;
            transition: all 0.2s ease;
        }

        .back-btn:hover {
            color: var(--text-primary);
            border-color: var(--text-primary);
        }

        .boxscore-matchup-card {
            background-color: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 10px 16px;
            display: flex;
            flex-direction: column;
            gap: 4px;
            margin-bottom: 16px;
        }

        .boxscore-game-info {
            text-align: center;
            font-size: 0.7rem;
            color: var(--text-secondary);
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .boxscore-teams-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .boxscore-team {
            display: flex;
            align-items: center;
            gap: 8px;
            flex: 1;
        }

        .boxscore-team.right {
            justify-content: flex-end;
            text-align: right;
        }

        .boxscore-team img {
            width: 26px;
            height: 26px;
            object-fit: contain;
        }

        .boxscore-team-name {
            font-size: 0.95rem;
            font-weight: 700;
        }

        .boxscore-score {
            font-size: 1.3rem;
            font-weight: 800;
            padding: 0 12px;
        }

        /* Centered Team Statistics Table Layout */
        .comparison-table {
            width: 80%;
            max-width: 600px;
            margin: 0 auto;
            border-collapse: collapse;
        }

        .comparison-table td, .comparison-table th {
            padding: 10px 16px;
        }

        .player-stats-table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }

        .player-stats-table th, .player-stats-table td {
            padding: 10px 12px;
            font-size: 0.85rem;
            border-bottom: 1px solid var(--border);
        }

        .player-stats-table th {
            color: var(--text-secondary);
            font-weight: 600;
            background-color: rgba(0, 0, 0, 0.1);
        }

        .player-stats-table tr:last-child td {
            border-bottom: none;
        }

        .player-stats-table th:first-child,
        .player-stats-table td:first-child {
            width: 38%;
            text-align: left;
        }

        .player-stats-table th:nth-child(2),
        .player-stats-table td:nth-child(2) {
            min-width: 65px;
            white-space: nowrap;
            text-align: center;
        }

        .player-stats-table th:nth-child(n+3),
        .player-stats-table td:nth-child(n+3) {
            text-align: center;
        }

        .link-badge {
            color: var(--accent);
            text-decoration: none;
            font-weight: 600;
        }

        .link-badge:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <header>
        <div class="header-top">
            <h1>Sports Hub & Live Streams</h1>
            <div class="nav-tabs">
                <button class="tab-btn active" onclick="switchLeague('nfl', this)">NFL</button>
                <button class="tab-btn" onclick="switchLeague('nba', this)">NBA</button>
                <button class="tab-btn" onclick="switchLeague('mlb', this)">MLB</button>
                <button class="tab-btn" onclick="switchLeague('cfb', this)">CFB</button>
                <button class="tab-btn" onclick="switchLeague('cbb', this)">CBB</button>
                <button class="tab-btn" onclick="switchLeague('test', this)">Test</button>
            </div>
        </div>
        <div class="filter-bar" id="filter-container">
            <select id="conference-select" class="hidden" onchange="handleFilterChange()"></select>
            <button class="action-btn" id="standings-toggle-btn" onclick="toggleStandingsView()">View Standings</button>
            <button class="secondary-btn" id="secondary-standings-btn" onclick="toggleWildCardView()">View Wild Card</button>
        </div>
    </header>

    <main id="content-area">
        <div class="loading">Select a league above to start...</div>
    </main>

    <script>
        const endpoints = {
            nfl: { sport: 'football', league: 'nfl', type: 'pro', conferences: null },
            nba: { sport: 'basketball', league: 'nba', type: 'pro', conferences: null },
            mlb: { sport: 'baseball', league: 'mlb', type: 'pro', conferences: null },
            cfb: { 
                sport: 'football', 
                league: 'college-football', 
                type: 'college',
                conferences: [
                    { name: 'All FBS', param: '?groups=80', type: 'rankings-fbs' },
                    { name: 'FCS', param: '?groups=81', type: 'rankings-fcs' },
                    { name: 'SEC', param: '?groups=8', type: 'standings' },
                    { name: 'Big Ten', param: '?groups=5', type: 'standings' },
                    { name: 'Big 12', param: '?groups=1', type: 'standings' },
                    { name: 'ACC', param: '?groups=151', type: 'standings' },
                    { name: 'American Athletic', param: '?groups=151', type: 'standings' },
                    { name: 'Mountain West', param: '?groups=17', type: 'standings' },
                    { name: 'PAC-12', param: '?groups=9', type: 'standings' },
                    { name: 'MAC', param: '?groups=15', type: 'standings' },
                    { name: 'Sun Belt', param: '?groups=37', type: 'standings' },
                    { name: 'Conference USA', param: '?groups=12', type: 'standings' },
                    { name: 'FBS Independents', param: '?groups=112', type: 'standings' }
                ]
            },
            cbb: { 
                sport: 'basketball', 
                league: 'mens-college-basketball', 
                type: 'college',
                conferences: [
                    { name: 'All Top Tier (Div I)', param: '?groups=50', type: 'rankings-fbs' },
                    { name: 'SEC', param: '?groups=23', type: 'standings' },
                    { name: 'Big Ten', param: '?groups=7', type: 'standings' },
                    { name: 'Big 12', param: '?groups=8', type: 'standings' },
                    { name: 'ACC', param: '?groups=2', type: 'standings' },
                    { name: 'Big East', param: '?groups=4', type: 'standings' }
                ]
            },
            test: {
                type: 'test',
                conferences: null
            }
        };

        let currentLeagueKey = 'nfl';
        let isShowingStandings = false;
        let isShowingWildCard = false;
        let currentView = 'hub';
        let cachedEvents = [];
        let allFetchedGames = {}; 
        let globalBoxScoreData = null;

        const testJsonData = {
            "links": [
                {
                    "source_site": "https://mybuffstreams.plus/mlb-live-streams",
                    "text": "San Diego PadresIn ProgressMiami MarlinsLive Streams",
                    "href": "https://mybuffstreams.plus/mlb/miami-marlins-san-diego-padres/1376015"
                }
            ]
        };

        async function backgroundPrefetch() {
            const leagueKeys = ['nfl', 'nba', 'mlb', 'cbb'];
            for (let lKey of leagueKeys) {
                const cfg = endpoints[lKey];
                let queryParam = cfg.conferences ? cfg.conferences[0].param : '';
                const url = `https://site.api.espn.com/apis/site/v2/sports/${cfg.sport}/${cfg.league}/scoreboard${queryParam}`;
                try {
                    const res = await fetch(url);
                    const data = await res.json();
                    if (data.events) {
                        allFetchedGames[lKey] = data.events;
                    }
                } catch (e) {}
            }

            const cfbCfg = endpoints['cfb'];
            let combinedCfbEvents = [];
            const cfbGroups = ['?groups=80', '?groups=81'];
            
            for (let param of cfbGroups) {
                const url = `https://site.api.espn.com/apis/site/v2/sports/${cfbCfg.sport}/${cfbCfg.league}/scoreboard${param}`;
                try {
                    const res = await fetch(url);
                    const data = await res.json();
                    if (data.events) {
                        combinedCfbEvents = combinedCfbEvents.concat(data.events);
                    }
                } catch (e) {}
            }

            const uniqueMap = new Map();
            combinedCfbEvents.forEach(ev => uniqueMap.set(ev.id, ev));
            allFetchedGames['cfb'] = Array.from(uniqueMap.values());
        }

        async function loadData() {
            currentView = 'hub';
            const contentArea = document.getElementById('content-area');
            
            if (currentLeagueKey === 'test') {
                renderTestTab(testJsonData.links);
                return;
            }

            contentArea.innerHTML = '<div class="loading">Loading...</div>';

            if (isShowingStandings) {
                if (isShowingWildCard && currentLeagueKey === 'mlb') {
                    await fetchMLBWildCardStandings();
                } else {
                    await fetchStandings();
                }
            } else {
                await fetchScores();
            }
        }

        async function openBoxScore(eventId) {
            currentView = 'boxscore';
            const contentArea = document.getElementById('content-area');
            contentArea.innerHTML = '<div class="loading">Loading box score...</div>';

            const cfg = endpoints[currentLeagueKey];
            const url = `https://site.api.espn.com/apis/site/v2/sports/${cfg.sport}/${cfg.league}/summary?event=${eventId}`;

            try {
                const res = await fetch(url);
                if (!res.ok) throw new Error('Failed to fetch box score');
                globalBoxScoreData = await res.json();
                renderBoxScore(globalBoxScoreData);
            } catch (err) {
                contentArea.innerHTML = `
                    <div class="boxscore-header">
                        <button class="back-btn" onclick="loadData()">← Back to Scores</button>
                    </div>
                    <div class="error">Detailed box score is unavailable for this matchup right now.</div>
                `;
            }
        }

        function renderBoxScore(data) {
            const contentArea = document.getElementById('content-area');
            const competition = data.header?.competitions?.[0] || data.competitions?.[0];
            if (!competition) {
                contentArea.innerHTML = `<div class="error">Matchup details not found.</div>`;
                return;
            }

            const competitors = competition.competitors;
            const homeTeam = competitors.find(c => c.homeAway === 'home');
            const awayTeam = competitors.find(c => c.homeAway === 'away');
            const statusDetail = competition.status?.type?.detail || '';

            let html = `
                <div class="boxscore-header">
                    <button class="back-btn" onclick="loadData()">← Back to Scores</button>
                </div>
                <div class="boxscore-matchup-card">
                    <div class="boxscore-game-info">${competition.status?.type?.description || 'Matchup'} • ${statusDetail}</div>
                    <div class="boxscore-teams-row">
                        <div class="boxscore-team">
                            <img src="${awayTeam.team?.logo || ''}" alt="" onerror="this.style.display='none'">
                            <span class="boxscore-team-name">${awayTeam.team?.shortDisplayName || awayTeam.team?.name}</span>
                        </div>
                        <div class="boxscore-score">${awayTeam.score || '0'} - ${homeTeam.score || '0'}</div>
                        <div class="boxscore-team right">
                            <span class="boxscore-team-name">${homeTeam.team?.shortDisplayName || homeTeam.team?.name}</span>
                            <img src="${homeTeam.team?.logo || ''}" alt="" onerror="this.style.display='none'">
                        </div>
                    </div>
                </div>
            `;

            if (currentLeagueKey !== 'mlb' && data.boxscore && data.boxscore.teams && data.boxscore.teams.length === 2) {
                const awayStats = data.boxscore.teams.find(t => t.team.id === awayTeam.id)?.statistics || [];
                const homeStats = data.boxscore.teams.find(t => t.team.id === homeTeam.id)?.statistics || [];

                const hasValidStats = awayStats.length > 0 && awayStats.some(s => s.label && s.displayValue !== undefined);

                const excludedStats = [
                    'comp/att', 
                    'yards per pass', 
                    'rushing attempts', 
                    'yards per rush', 
                    'fumbles lost', 
                    'interceptions thrown'
                ];

                if (hasValidStats) {
                    html += `
                        <div class="standings-section">
                            <div class="standings-title" style="text-align: center;">Team Statistics</div>
                            <div class="table-responsive">
                                <table class="comparison-table">
                                    <thead>
                                        <tr>
                                            <th style="width: 30%; text-align: left;">${awayTeam.team?.shortDisplayName || 'Away'}</th>
                                            <th style="width: 40%; text-align: center;">Stat</th>
                                            <th style="width: 30%; text-align: right;">${homeTeam.team?.shortDisplayName || 'Home'}</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                    `;

                    awayStats.forEach(stat => {
                        const statNameLower = (stat.name || '').toLowerCase();
                        const statLabelLower = (stat.label || '').toLowerCase();

                        const isExcluded = excludedStats.some(ex => statNameLower.includes(ex) || statLabelLower.includes(ex));
                        if (isExcluded) return;

                        const homeStatObj = homeStats.find(s => s.name === stat.name || s.label === stat.label);
                        const homeVal = homeStatObj ? homeStatObj.displayValue : '-';

                        let displayLabel = stat.label;
                        if (displayLabel) {
                            const lowerLbl = displayLabel.toLowerCase();
                            if (lowerLbl === '3rd down efficiency') {
                                displayLabel = '3rd Downs';
                            } else if (lowerLbl === '4th down efficiency') {
                                displayLabel = '4th Downs';
                            }
                        }

                        if (displayLabel && stat.displayValue !== undefined) {
                            html += `
                                <tr>
                                    <td style="text-align: left; font-weight: 600;">${stat.displayValue}</td>
                                    <td style="text-align: center; color: var(--text-secondary);">${displayLabel}</td>
                                    <td style="text-align: right; font-weight: 600;">${homeVal}</td>
                                </tr>
                            `;
                        }
                    });

                    html += `</tbody></table></div></div>`;
                }
            }

            contentArea.innerHTML = html;
        }

        backgroundPrefetch().then(() => {
            switchLeague('nfl', document.querySelector('.tab-btn'));
        });
    </script>
</body>
</html>
