<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Big Dog Streams</title>
    <!-- Favicon link added below -->
    <link rel="icon" type="image/jpeg" href="IMG_0916.jpeg">
    <style>
        :root {
            --bg-primary: #0f172a;
            --bg-secondary: #1e293b;
            --bg-card: #1e293b;
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --accent: #38bdf8;
            --accent-hover: #0ea5e9;
            --border: #334155;
            --success: #22c55e;
            --danger: #ef4444;
            --live-pulse: #ef4444;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* --- Landing Page Overlay Styles --- */
        #landing-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: var(--bg-primary);
            z-index: 1000;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
            padding: 16px 8px;
        }

        #landing-overlay.hidden {
            display: none !important;
        }

        .landing-header {
            text-align: center;
            padding: 10px 0 16px 0;
            flex-shrink: 0;
        }

        .landing-container {
            max-width: 1000px;
            width: 100%;
            margin: 0 auto;
            display: flex;
            flex-direction: row; /* Strict side-by-side for desktop and mobile */
            flex: 1;
            position: relative;
            gap: 12px;
            justify-content: center;
            align-items: flex-start;
        }

        .landing-section {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 4px;
            min-width: 0; /* Ensures proper layout shrink on small screens */
        }

        .landing-section-title {
            font-size: 1.4rem;
            font-weight: 700;
            margin-bottom: 16px;
            color: var(--text-primary);
            border-bottom: 2px solid var(--border);
            padding-bottom: 8px;
            width: 100%;
            text-align: center;
        }

        .landing-divider {
            width: 2px;
            background-color: var(--border);
            align-self: stretch;
            margin: 10px 0;
            flex-shrink: 0;
        }

        .grid-movies {
            display: flex;
            flex-direction: column;
            gap: 12px;
            width: 100%;
            max-width: 400px;
        }

        .row-top-movies {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .grid-sports {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            width: 100%;
            max-width: 400px;
        }

        .landing-card {
            background-color: var(--bg-card);
            border: 2px solid var(--border);
            border-radius: 12px;
            padding: 12px 8px;
            text-align: center;
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--text-primary);
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 8px;
            user-select: none;
            aspect-ratio: 1 / 1; /* Ensures perfectly square uniform buttons */
            width: 100%;
        }

        .landing-card-logo-wrapper {
            height: 36px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .landing-card-logo {
            height: 36px;
            width: auto;
            max-width: 100%;
            object-fit: contain;
        }

        /* Specific sizing adjustments for visually wide icons like MLB & MMA */
        .landing-card-logo.shrink-icon {
            height: 28px;
        }

        .landing-card:hover {
            border-color: var(--accent);
            background-color: var(--bg-secondary);
            transform: translateY(-2px);
            color: var(--accent);
            box-shadow: 0 4px 12px rgba(56, 189, 248, 0.15);
        }

        .landing-card.card-disabled {
            opacity: 0.6;
            cursor: not-allowed;
            aspect-ratio: auto; /* Movies/TV layout adjustments */
            height: 100%;
            min-height: 80px;
        }

        .landing-card.card-disabled:hover {
            border-color: var(--border);
            background-color: var(--bg-card);
            transform: none;
            color: var(--text-primary);
            box-shadow: none;
        }

        /* Active (clickable) Movies/TV/Live TV buttons - same layout as the old disabled style */
        .landing-card.card-media {
            aspect-ratio: auto;
            height: 100%;
            min-height: 80px;
        }

        .card-full-width {
            grid-column: span 2;
            min-height: 70px;
            aspect-ratio: auto;
        }

        @media (max-width: 480px) {
            .landing-section-title {
                font-size: 1.1rem;
                margin-bottom: 12px;
            }
            .landing-card {
                font-size: 0.9rem;
                padding: 8px 4px;
                border-radius: 10px;
                gap: 6px;
            }
            .landing-card-logo-wrapper {
                height: 30px;
            }
            .landing-card-logo {
                height: 30px;
            }
            .landing-card-logo.shrink-icon {
                height: 22px;
            }
            .grid-movies, .grid-sports {
                gap: 8px;
            }
            .row-top-movies {
                gap: 8px;
            }
        }
        /* --- End Landing Page Styles --- */

        /* --- Movies / TV / Live TV Subpage Styles --- */
        .media-subpage {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: var(--bg-primary);
            z-index: 1001;
            display: none;
            flex-direction: column;
            overflow-y: auto;
        }

        .media-subpage.visible {
            display: flex;
        }

        .media-subpage-header {
            background-color: var(--bg-secondary);
            border-bottom: 1px solid var(--border);
            padding: 8px 12px;
            display: flex;
            align-items: center;
            gap: 16px;
            flex-wrap: wrap;
        }

        .media-subpage-title-area {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .media-subpage-title {
            font-size: 1.2rem;
            font-weight: 700;
            color: var(--text-primary);
        }

        .movie-nav-tabs {
            display: flex;
            gap: 4px;
            margin-left: auto;
        }

        .movie-tab-btn {
            background-color: var(--bg-primary);
            color: var(--text-secondary);
            border: 1px solid var(--border);
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.85rem;
            transition: all 0.2s ease;
        }

        .movie-tab-btn:hover {
            color: var(--text-primary);
            border-color: var(--text-secondary);
        }

        .movie-tab-btn.active {
            background-color: var(--accent);
            color: var(--bg-primary);
            border-color: var(--accent);
        }

        .media-subpage-content {
            flex: 1;
            padding: 16px 24px 24px 24px;
            max-width: 1400px;
            width: 100%;
            margin: 0 auto;
        }
        /* --- End Subpage Styles --- */

        header {
            background-color: var(--bg-secondary);
            border-bottom: 1px solid var(--border);
            padding: 8px 12px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .header-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: nowrap;
            gap: 6px;
            max-width: 1400px;
            width: 100%;
            margin: 0 auto;
        }

        h1 {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--text-primary);
        }

        .nav-tabs {
            display: flex;
            gap: 2px;
            flex-wrap: nowrap;
            overflow: visible;
            max-width: 100%;
        }

        .tab-btn {
            background-color: var(--bg-primary);
            color: var(--text-secondary);
            border: 1px solid var(--border);
            padding: 4px 6px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.7rem;
            transition: all 0.2s ease;
            flex-shrink: 0;
        }

        .tab-btn:hover {
            color: var(--text-primary);
            border-color: var(--text-secondary);
        }

        .tab-btn.active {
            background-color: var(--accent);
            color: var(--bg-primary);
            border-color: var(--accent);
        }

        .tab-btn[onclick*="test"] {
            display: none !important;
        }

        .filter-bar {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
            visibility: hidden;
            opacity: 0;
            transition: opacity 0.2s ease;
            height: 0;
            overflow: hidden;
            margin-bottom: 0px;
            max-width: 1400px;
            width: 100%;
            margin-left: auto;
            margin-right: auto;
        }

        .filter-bar.visible {
            visibility: visible;
            opacity: 1;
            height: auto;
            margin-bottom: 16px;
        }

        select {
            background-color: var(--bg-primary);
            color: var(--text-primary);
            border: 1px solid var(--border);
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 0.9rem;
            outline: none;
            cursor: pointer;
        }

        select.hidden {
            display: none;
        }

        .action-btn {
            background-color: transparent;
            color: var(--accent);
            border: 1px solid var(--accent);
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.9rem;
            transition: all 0.2s ease;
        }

        .action-btn:hover {
            background-color: var(--accent);
            color: var(--bg-primary);
        }

        .action-btn.standings-active {
            background-color: var(--accent);
            color: var(--bg-primary);
        }

        .secondary-btn {
            background-color: transparent;
            color: var(--text-secondary);
            border: 1px solid var(--border);
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.9rem;
            display: none;
            transition: all 0.2s ease;
        }

        .secondary-btn.visible {
            display: inline-block;
        }

        .secondary-btn:hover {
            border-color: var(--text-primary);
            color: var(--text-primary);
        }

        .secondary-btn.active {
            border-color: var(--accent);
            color: var(--accent);
        }

        main {
            flex: 1;
            padding: 16px 24px 24px 24px;
            max-width: 1400px;
            width: 100%;
            margin: 0 auto;
        }

        .loading, .error, .no-data {
            text-align: center;
            padding: 48px;
            color: var(--text-secondary);
            font-size: 1.1rem;
        }

        .error {
            color: var(--danger);
        }

        .games-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 16px;
        }

        .game-card {
            background-color: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 16px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            gap: 12px;
            transition: transform 0.2s ease, border-color 0.2s ease;
        }

        .game-card:hover {
            transform: translateY(-2px);
            border-color: var(--text-secondary);
        }

        .game-status-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.8rem;
            color: var(--text-secondary);
            margin-bottom: 8px;
        }

        .status-live {
            color: var(--danger);
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .pulse-dot {
            width: 8px;
            height: 8px;
            background-color: var(--danger);
            border-radius: 50%;
            display: inline-block;
            box-shadow: 0 0 0 rgba(239, 68, 68, 0.4);
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% {
                box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7);
            }
            70% {
                box-shadow: 0 0 0 6px rgba(239, 68, 68, 0);
            }
            100% {
                box-shadow: 0 0 0 0 rgba(239, 68, 68, 0);
            }
        }

        .status-final {
            color: var(--text-secondary);
            font-weight: 600;
        }

        .status-scheduled {
            color: var(--accent);
            font-weight: 600;
        }

        .teams-container {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .team-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .team-info {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .team-logo {
            width: 24px;
            height: 24px;
            object-fit: contain;
        }

        .team-name {
            font-size: 0.95rem;
            font-weight: 600;
        }

        .team-score {
            font-size: 1.1rem;
            font-weight: 700;
        }

        .team-odds {
            font-size: 0.75rem;
            font-weight: 600;
            margin-left: 8px;
            margin-right: 12px;
        }

        .odds-positive {
            color: var(--success);
        }

        .odds-negative {
            color: var(--danger);
        }

        .card-footer {
            border-top: 1px solid var(--border);
            padding-top: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.75rem;
            color: var(--text-secondary);
            gap: 8px;
        }

        .espn-gamecast-link {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 2px 4px;
            border-radius: 4px;
            transition: opacity 0.2s ease;
        }

        .espn-gamecast-link:hover {
            opacity: 0.8;
        }

        .view-boxscore-hint {
            color: var(--accent);
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            white-space: nowrap;
        }

        .view-boxscore-hint:hover {
            text-decoration: underline;
        }

        .streams-dropdown {
            position: relative;
            display: inline-block;
        }

        .streams-btn {
            background-color: var(--bg-primary);
            color: var(--accent);
            border: 1px solid var(--border);
            padding: 4px 10px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
            font-weight: 600;
            transition: all 0.2s ease;
        }

        .streams-btn:hover {
            border-color: var(--accent);
        }

        .streams-content {
            display: none;
            position: absolute;
            bottom: 100%;
            left: 0;
            background-color: var(--bg-secondary);
            min-width: 200px;
            border: 1px solid var(--border);
            border-radius: 6px;
            box-shadow: 0px 8px 16px rgba(0,0,0,0.4);
            z-index: 50;
            margin-bottom: 4px;
            max-height: 200px;
            overflow-y: auto;
        }

        .streams-content a {
            color: var(--text-primary);
            padding: 8px 12px;
            text-decoration: none;
            display: block;
            font-size: 12px;
            border-bottom: 1px solid var(--border);
        }

        .streams-content a:hover {
            background-color: var(--bg-primary);
            color: var(--accent);
        }

        .streams-dropdown.active .streams-content {
            display: block;
        }

        .redzone-card {
            background: linear-gradient(135deg, rgba(239, 68, 68, 0.15), rgba(30, 41, 59, 0.9));
            border: 1px solid rgba(239, 68, 68, 0.4);
            border-radius: 8px;
            padding: 8px 12px !important;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            gap: 4px !important;
            transition: transform 0.2s ease, border-color 0.2s ease;
        }

        .redzone-card:hover {
            transform: translateY(-2px);
            border-color: var(--danger);
        }

        .manningcast-card {
            background: linear-gradient(135deg, rgba(56, 189, 248, 0.15), rgba(30, 41, 59, 0.9));
            border: 1px solid rgba(56, 189, 248, 0.4);
            border-radius: 8px;
            padding: 8px 12px !important;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            gap: 4px !important;
            transition: transform 0.2s ease, border-color 0.2s ease;
        }

        .manningcast-card:hover {
            transform: translateY(-2px);
            border-color: var(--accent);
        }

        .standings-section {
            background-color: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 8px;
            overflow: hidden;
            margin-bottom: 24px;
        }

        .standings-title {
            background-color: rgba(255, 255, 255, 0.02);
            padding: 14px 20px;
            font-size: 1rem;
            font-weight: 700;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .table-responsive {
            width: 100%;
            overflow-x: auto;
        }

        .standings-table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
            font-size: 0.9rem;
        }

        .standings-table th, .standings-table td {
            padding: 7px 16px;
            border-bottom: 1px solid var(--border);
        }

        .standings-table th {
            color: var(--text-secondary);
            font-weight: 600;
            background-color: rgba(0, 0, 0, 0.1);
        }

        .standings-table tr:last-child td {
            border-bottom: none;
        }

        .team-cell {
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 600;
        }

        .boxscore-header {
            margin-bottom: 12px;
        }

        .back-btn {
            background-color: transparent;
            color: var(--text-secondary);
            border: 1px solid var(--border);
            padding: 5px 10px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: 600;
            transition: all 0.2s ease;
        }

        .back-btn:hover {
            color: var(--text-primary);
            border-color: var(--text-primary);
        }

        .boxscore-matchup-card {
            background-color: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 10px 16px;
            display: flex;
            flex-direction: column;
            gap: 4px;
            margin-bottom: 16px;
        }

        .boxscore-game-info {
            text-align: center;
            font-size: 0.7rem;
            color: var(--text-secondary);
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .boxscore-teams-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .boxscore-team {
            display: flex;
            align-items: center;
            gap: 8px;
            flex: 1;
        }

        .boxscore-team.right {
            justify-content: flex-end;
            text-align: right;
        }

        .boxscore-team img {
            width: 26px;
            height: 26px;
            object-fit: contain;
        }

        .boxscore-team-name {
            font-size: 0.95rem;
            font-weight: 700;
        }

        .boxscore-score {
            font-size: 1.3rem;
            font-weight: 800;
            padding: 0 12px;
        }

        .comparison-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.85rem;
            white-space: nowrap;
        }

        .comparison-table td, .comparison-table th {
            padding: 5px 12px;
            border-bottom: 1px solid var(--border);
        }

        .comparison-table th {
            color: var(--text-secondary);
            font-weight: 600;
            background-color: rgba(0, 0, 0, 0.1);
        }

        .comparison-table tr:last-child td {
            border-bottom: none;
        }

        .player-stats-table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
            white-space: nowrap;
        }

        .player-stats-table th, .player-stats-table td {
            padding: 6px 12px;
            font-size: 0.85rem;
            border-bottom: 1px solid var(--border);
        }

        .player-stats-table th {
            color: var(--text-secondary);
            font-weight: 600;
            background-color: rgba(0, 0, 0, 0.1);
        }

        .player-stats-table tr:last-child td {
            border-bottom: none;
        }

        .player-stats-table th:first-child,
        .player-stats-table td:first-child {
            width: 42%;
            text-align: left;
        }

        .player-stats-table th:nth-child(2),
        .player-stats-table td:nth-child(2) {
            min-width: 65px;
            text-align: center;
        }

        .player-stats-table th:nth-child(n+3),
        .player-stats-table td:nth-child(n+3) {
            text-align: center;
        }

        .link-badge {
            color: var(--accent);
            text-decoration: none;
            font-weight: 600;
        }

        .link-badge:hover {
            text-decoration: underline;
        }

        /* --- Movies Subpage (OMDb) Styles --- */
        .movie-search-container {
            display: none;
        }

        .movie-search-container.visible {
            display: flex;
            flex-direction: column;
        }

        .movie-search-bar {
            display: flex;
            gap: 8px;
            margin-bottom: 16px;
        }

        .movie-search-bar input {
            flex: 1;
            min-width: 0;
            background-color: var(--bg-secondary);
            color: var(--text-primary);
            border: 1px solid var(--border);
            padding: 10px 12px;
            border-radius: 6px;
            font-size: 0.95rem;
            outline: none;
        }

        .movie-search-bar input:focus {
            border-color: var(--accent);
        }

        .movies-section-title {
            font-size: 1.1rem;
            font-weight: 700;
            margin-bottom: 12px;
        }

        .movie-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            gap: 14px;
        }

        .movie-card {
            background-color: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 8px;
            overflow: hidden;
            cursor: pointer;
            transition: transform 0.2s ease, border-color 0.2s ease;
            display: flex;
            flex-direction: column;
        }

        .movie-card:hover {
            transform: translateY(-2px);
            border-color: var(--accent);
        }

        .movie-poster {
            width: 100%;
            aspect-ratio: 2 / 3;
            object-fit: cover;
            background-color: var(--bg-primary);
            display: block;
        }

            <button class="action-btn" id="standings-toggle-btn" onclick="toggleStandingsView()">View Standings</button>
            <button class="secondary-btn" id="secondary-standings-btn" onclick="toggleWildCardView()">View Wild Card</button>
        </div>
    </main>
    <script>
        let cachedRankings = {};

        async function fetchRankingsCache() {
            if (currentLeagueKey !== 'cfb' && currentLeagueKey !== 'cbb') return;
            const cfg = endpoints[currentLeagueKey];
            if (!cfg) return;
            try {
                const res = await fetch(`https://site.api.espn.com/apis/site/v2/sports/${cfg.sport}/${cfg.league}/rankings`);
                const data = await res.json();
                const rankingsList = data.rankings || [];
                
                if (currentLeagueKey === 'cfb') {
                    // Check for FCS poll as well if FCS tab is active or just cache multiple polls if available
                    let fbsPoll = rankingsList.find(p => {
                        const name = (p.name || p.headline || '').toLowerCase();
                        return name.includes('ap') || name.includes('fbs') || p.type === 'ap';
                    }) || rankingsList[0];

                    if (fbsPoll && fbsPoll.ranks) {
                        const rankMap = {};
                        fbsPoll.ranks.forEach(r => {
                            const teamId = r.team?.id;
                            if (teamId) {
                                rankMap[teamId] = r.current;
                            }
                        });
                        cachedRankings['cfb_fbs'] = rankMap;
                    }

                    let fcsPoll = rankingsList.find(p => {
                        const name = (p.name || p.headline || '').toLowerCase();
                        return name.includes('fcs') || name.includes('stats perform') || p.type === 'fcs';
                    });

                    if (fcsPoll && fcsPoll.ranks) {
                        const rankMap = {};
                        fcsPoll.ranks.forEach(r => {
                            const teamId = r.team?.id;
                            if (teamId) {
                                rankMap[teamId] = r.current;
                            }
                        });
                        cachedRankings['cfb_fcs'] = rankMap;
                    }
                } else {
                    let poll = rankingsList.find(p => {
                        const name = (p.name || p.headline || '').toLowerCase();
                        return name.includes('ap') || name.includes('fbs') || p.type === 'ap';
                    }) || rankingsList[0];

                    if (poll && poll.ranks) {
                        const rankMap = {};
                        poll.ranks.forEach(r => {
                            const teamId = r.team?.id;
                            if (teamId) {
                                rankMap[teamId] = r.current;
                            }
                        });
                        cachedRankings[currentLeagueKey] = rankMap;
                    }
                }
            } catch (e) {
                // Ignore ranking fetch errors
            }
        }

        function selectLandingLeague(leagueKey) {
            document.getElementById('landing-overlay').classList.add('hidden');
            const targetBtn = Array.from(document.querySelectorAll('.tab-btn')).find(
                btn => btn.getAttribute('onclick')?.includes(`'${leagueKey}'`)
            );
            if (targetBtn) {
                switchLeague(leagueKey, targetBtn);
            }
        }

        function showLandingPage() {
            document.getElementById('landing-overlay').classList.remove('hidden');
        }

        // --- Movies / TV / Live TV subpage navigation ---
        function openMediaSubpage(pageKey) {
            document.querySelectorAll('.media-subpage').forEach(p => p.classList.remove('visible'));
            const page = document.getElementById('subpage-' + pageKey);
            if (page) {
                page.classList.add('visible');
            }
            if (pageKey === 'movies') {
                const defaultTabBtn = document.querySelector('#subpage-movies .movie-tab-btn');
                switchMovieTab('newly-released', defaultTabBtn);
            }
        }

        // --- Movies page (OMDb API) ---
        const OMDB_API_KEY = '46881df9';
        const OMDB_BASE_URL = 'https://www.omdbapi.com/';
        const NEWLY_RELEASED_IDS = [
            'tt15398776', 'tt13622970', 'tt16407152', 'tt15239678', 
            'tt11655202', 'tt9362722', 'tt10676048', 'tt1517268',
            'tt2382320', 'tt6263850', 'tt15791034', 'tt16335442'
        ];
        const TOP_RATED_IDS = [
            'tt0111161', 'tt0068646', 'tt0468569', 'tt0137523',
            'tt0109830', 'tt1375666', 'tt0133093', 'tt0110912',
            'tt0816692', 'tt0172495', 'tt0120737', 'tt0076759'
        ];
        let moviesInitialized = false;
        let movieSearchState = { query: '', page: 1, total: 0, results: [] };
        let savedMovieListHtml = '';
        let currentMovieTab = 'newly-released';

        function escHtml(str) {
            return String(str ?? '')
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        async function omdbFetch(params) {
            const qs = new URLSearchParams({ apikey: OMDB_API_KEY, ...params });
            const res = await fetch(`${OMDB_BASE_URL}?${qs.toString()}`);
            let data;
            try {
                data = await res.json();
            } catch (e) {
                throw new Error('OMDb request failed (HTTP ' + res.status + ')');
            }
            return data;
        }

        function getMoviesArea() {
            return document.getElementById('movies-content');
        }

        function switchMovieTab(tabKey, btnElement) {
            currentMovieTab = tabKey;
            document.querySelectorAll('#subpage-movies .movie-tab-btn').forEach(btn => btn.classList.remove('active'));
            if (btnElement) btnElement.classList.add('active');

            const searchContainer = document.getElementById('movie-search-container');
            if (tabKey === 'search') {
                searchContainer.classList.add('visible');
                const area = getMoviesArea();
                if (!movieSearchState.results.length && !movieSearchState.query) {
                    area.innerHTML = '<div class="no-data">Type a query above and press search to find movies.</div>';
                } else if (movieSearchState.results.length > 0) {
                    renderMovieSearchResults();
                } else {
                    area.innerHTML = '';
                }
            } else {
                searchContainer.classList.remove('visible');
                if (tabKey === 'newly-released') {
                    loadNewlyReleasedMovies();
                } else if (tabKey === 'top-rated') {
                    loadTopRatedMovies();
                }
            }
        }

        function movieCardHtml(m) {
            const id = String(m.imdbID || '').replace(/[^a-zA-Z0-9]/g, '');
            const hasPoster = m.Poster && m.Poster !== 'N/A';
            const posterHtml = hasPoster
                ? `<img class="movie-poster" src="${escHtml(m.Poster)}" alt="${escHtml(m.Title)}" loading="lazy" onerror="this.outerHTML='<div class=&quot;movie-poster-placeholder&quot;>No Poster</div>'">`
                : `<div class="movie-poster-placeholder">No Poster</div>`;
            return `
                <div class="movie-card" onclick="openMovieDetail('${id}')">
                    ${posterHtml}
                    <div class="movie-card-info">
                        <div class="movie-card-title">${escHtml(m.Title)}</div>
                        <div class="movie-card-year">${escHtml(m.Year)}</div>
                    </div>
                </div>
            `;
        }

        async function loadNewlyReleasedMovies() {
            const area = getMoviesArea();
            area.innerHTML = '<div class="loading">Loading newly released movies...</div>';
            try {
                const results = await Promise.all(
                    NEWLY_RELEASED_IDS.map(id => omdbFetch({ i: id }).catch(e => ({ Response: 'False', Error: 'Network error: ' + e.message })))
                );
                let movies = results.filter(r => r && r.Response === 'True');
                
                // Sort by release date descending
                movies.sort((a, b) => {
                    const dateA = new Date(a.Released !== 'N/A' ? a.Released : (a.Year + '-01-01'));
                    const dateB = new Date(b.Released !== 'N/A' ? b.Released : (b.Year + '-01-01'));
                    return dateB - dateA;
                });

                if (movies.length === 0) {
                    area.innerHTML = `<div class="error">Unable to load newly released movies.</div>`;
                    return;
                }
                area.innerHTML = `
                    <div class="movies-section-title">Newly Released Movies</div>
                    <div class="movie-grid">${movies.map(movieCardHtml).join('')}</div>
                `;
            } catch (err) {
                console.error(err);
                area.innerHTML = '<div class="error">Unable to load movies right now. Please try again later.</div>';
            }
        }

        async function loadTopRatedMovies() {
            const area = getMoviesArea();
            area.innerHTML = '<div class="loading">Loading top-rated movies...</div>';
            try {
                const results = await Promise.all(
                    TOP_RATED_IDS.map(id => omdbFetch({ i: id }).catch(e => ({ Response: 'False', Error: 'Network error: ' + e.message })))
                );
                let movies = results.filter(r => r && r.Response === 'True');
                
                // Sort by IMDb rating descending
                movies.sort((a, b) => {
                    const ratingA = parseFloat(a.imdbRating) || 0;
                    const ratingB = parseFloat(b.imdbRating) || 0;
                    return ratingB - ratingA;
                });

                if (movies.length === 0) {
                    area.innerHTML = `<div class="error">Unable to load top-rated movies.</div>`;
                    return;
                }
                area.innerHTML = `
                    <div class="movies-section-title">Top Rated Movies (IMDb)</div>
                    <div class="movie-grid">${movies.map(movieCardHtml).join('')}</div>
                `;
            } catch (err) {
                console.error(err);
                area.innerHTML = '<div class="error">Unable to load movies right now. Please try again later.</div>';
            }
        }

        async function searchMovies() {
            const input = document.getElementById('movie-search-input');
            const query = (input.value || '').trim();
            if (!query) return;
            
            const area = getMoviesArea();
            area.innerHTML = '<div class="loading">Searching...</div>';
            movieSearchState = { query: query, page: 1, total: 0, results: [] };
            try {
                const data = await omdbFetch({ s: query, type: 'movie', page: 1 });
                if (data.Response !== 'True') {
                    area.innerHTML = `<div class="no-data">${escHtml(data.Error || 'No movies found.')}</div>`;
                    return;
                }
                movieSearchState.total = parseInt(data.totalResults, 10) || data.Search.length;
                movieSearchState.results = data.Search;
                renderMovieSearchResults();
            } catch (err) {
                console.error(err);
                area.innerHTML = `<div class="error">Search failed.<br><span style="font-size: 0.85rem;">Reason: ${escHtml(err.message)}</span></div>`;
            }
        }

        function renderMovieSearchResults() {
            const area = getMoviesArea();
            const shown = movieSearchState.results.length;
            const hasMore = shown < movieSearchState.total;
            area.innerHTML = `
                <div class="movies-section-title">Results for "${escHtml(movieSearchState.query)}" (${movieSearchState.total})</div>
                <div class="movie-grid">${movieSearchState.results.map(movieCardHtml).join('')}</div>
                ${hasMore ? '<div class="movie-load-more"><button class="action-btn" onclick="loadMoreMovies(this)">Load More</button></div>' : ''}
            `;
        }

        async function loadMoreMovies(btn) {
            if (btn) {
                btn.disabled = true;
                btn.textContent = 'Loading...';
            }
            try {
                const nextPage = movieSearchState.page + 1;
                const data = await omdbFetch({ s: movieSearchState.query, type: 'movie', page: nextPage });
                if (data.Response === 'True') {
                    movieSearchState.page = nextPage;
                    const seen = new Set(movieSearchState.results.map(m => m.imdbID));
                    data.Search.forEach(m => {
                        if (!seen.has(m.imdbID)) movieSearchState.results.push(m);
                    });
                }
                renderMovieSearchResults();
            } catch (err) {
                console.error(err);
                if (btn) {
                    btn.disabled = false;
                    btn.textContent = 'Load More';
                }
            }
        }

        async function openMovieDetail(imdbId) {
            const area = getMoviesArea();
            savedMovieListHtml = area.innerHTML;
            area.innerHTML = '<div class="loading">Loading details...</div>';
            document.getElementById('subpage-movies').scrollTop = 0;
            try {
                const m = await omdbFetch({ i: imdbId, plot: 'full' });
                if (m.Response !== 'True') throw new Error(m.Error || 'Not found');

                const hasPoster = m.Poster && m.Poster !== 'N/A';
                const posterHtml = hasPoster
                    ? `<img class="movie-detail-poster" src="${escHtml(m.Poster)}" alt="${escHtml(m.Title)}">`
                    : `<div class="movie-poster-placeholder movie-detail-poster">No Poster</div>`;

                const badges = [];
                if (m.imdbRating && m.imdbRating !== 'N/A') badges.push(`⭐ IMDb ${escHtml(m.imdbRating)}/10`);
                (m.Ratings || []).forEach(r => {
                    if (r.Source === 'Rotten Tomatoes') badges.push(`🍅 ${escHtml(r.Value)}`);
                    if (r.Source === 'Metacritic') badges.push(`Metacritic ${escHtml(r.Value)}`);
                });
                if (m.Rated && m.Rated !== 'N/A') badges.push(escHtml(m.Rated));

                const row = (label, value) => (value && value !== 'N/A')
                    ? `<div class="movie-detail-row"><span class="label">${label}:</span> ${escHtml(value)}</div>`
                    : '';

                const metaParts = [m.Year, m.Runtime, m.Genre].filter(v => v && v !== 'N/A').map(escHtml);
                const imdbLink = `https://www.imdb.com/title/${encodeURIComponent(m.imdbID)}/`;

                area.innerHTML = `
                    <div class="boxscore-header">
                        <button class="back-btn" onclick="closeMovieDetail()">← Back to Movies</button>
                    </div>
                    <div class="movie-detail">
                        ${posterHtml}
                        <div class="movie-detail-info">
                            <div class="movie-detail-title">${escHtml(m.Title)}</div>
                            <div class="movie-detail-meta">${metaParts.join(' • ')}</div>
                            <div class="movie-badges">${badges.map(b => `<span class="movie-badge">${b}</span>`).join('')}</div>
                            ${m.Plot && m.Plot !== 'N/A' ? `<div class="movie-plot">${escHtml(m.Plot)}</div>` : ''}
                            ${row('Director', m.Director)}
                            ${row('Writer', m.Writer)}
                            ${row('Cast', m.Actors)}
                            ${row('Released', m.Released)}
                            ${row('Language', m.Language)}
                            ${row('Country', m.Country)}
                            ${row('Awards', m.Awards)}
                            ${row('Box Office', m.BoxOffice)}
                            <div class="movie-detail-row" style="margin-top: 10px;">
                                <a class="link-badge" href="${imdbLink}" target="_blank">View on IMDb →</a>
                            </div>
                        </div>
                    </div>
                `;
            } catch (err) {
                console.error(err);
                area.innerHTML = `
                    <div class="boxscore-header">
                        <button class="back-btn" onclick="closeMovieDetail()">← Back to Movies</button>
                    </div>
                    <div class="error">Unable to load movie details right now.</div>
                `;
            }
        }

        function closeMovieDetail() {
            const area = getMoviesArea();
            if (savedMovieListHtml) {
                area.innerHTML = savedMovieListHtml;
            } else {
                switchMovieTab(currentMovieTab, document.querySelector(`.movie-tab-btn[onclick*="${currentMovieTab}"]`));
            }
        }

        function closeMediaSubpage() {
            document.querySelectorAll('.media-subpage').forEach(p => p.classList.remove('visible'));
        }

        const endpoints = {
            nfl: { sport: 'football', league: 'nfl', type: 'pro', conferences: null, espnSlug: 'nfl' },
            nba: { sport: 'basketball', league: 'nba', type: 'pro', conferences: null, espnSlug: 'nba' },
            mlb: { sport: 'baseball', league: 'mlb', type: 'pro', conferences: null, espnSlug: 'mlb' },
            cfb: { 
                sport: 'football', 
                league: 'college-football', 
                type: 'college',
                espnSlug: 'college-football',
                conferences: [
                    { name: 'All FBS', param: '?groups=80', type: 'rankings-fbs' },

        function cleanMatchupText(text) {
            return text
                .replace(/live\s*streams/gi, '')
                .replace(/in\s*progress/gi, '')
                .replace(/halftime/gi, '')
                .replace(/\d+(?:st|nd|rd|th)\s*quarter/gi, '')
                .replace(/\d+(?:st|nd|rd|th)\s*half/gi, '')
                .replace(/\d{1,2}:\d{2}\s*(?:am|pm)?/gi, '')
                .toLowerCase()
                .trim();
        }

        function determineMatchedLeague(row) {
            const source = (row.source_site || '').toLowerCase();
            const href = (row.href || '').toLowerCase();
            
            if (source.includes('mlb') || href.includes('/mlb/')) return 'MLB';
            if (source.includes('nba') || href.includes('/nba/')) return 'NBA';
            if (source.includes('nfl') || href.includes('/nfl/')) return 'NFL';
            if (source.includes('cfb') || href.includes('/cfb/')) return 'CFB';
            if (source.includes('ncaa') || source.includes('cbb') || href.includes('/cbb/') || href.includes('/ncaa/')) return 'CBB';
            
            return 'Unknown';
        }

        function findBestMatch(rowText, sourceSite) {
            let lowerRowText = rowText.toLowerCase();

            if (lowerRowText.includes('manningcast')) {
                return `<span style="color: var(--text-primary); font-weight: 500;">Manningcast</span>`;
            }

            if (lowerRowText.includes('redzone')) {
                return `<span style="color: var(--text-primary); font-weight: 500;">Redzone</span>`;
            }

            let targetLeagues = [];
            
            if (sourceSite.includes('mlb')) {
                targetLeagues = ['mlb'];
            } else if (sourceSite.includes('nflstreams')) {
                targetLeagues = ['cfb', 'nfl'];
            } else {
                targetLeagues = Object.keys(allFetchedGames);
            }

            let allGamesList = [];
            targetLeagues.forEach(lKey => {
                if (allFetchedGames[lKey]) {
                    allGamesList = allGamesList.concat(allFetchedGames[lKey]);
                }
            });

            if (allGamesList.length === 0) return '<span style="color: var(--text-secondary);">NA</span>';

            let cleanedText = cleanMatchupText(rowText);

            let bestMatch = null;
            let foundExactPair = false;

            for (let event of allGamesList) {
                const comp = event.competitions?.[0];
                if (!comp || !comp.competitors) continue;

                const awayTeam = comp.competitors.find(t => t.homeAway === 'away')?.team;
                const homeTeam = comp.competitors.find(t => t.homeAway === 'home')?.team;
                if (!awayTeam || !homeTeam) continue;

                const awayNames = [
                    (awayTeam?.displayName || '').toLowerCase(),
                    (awayTeam?.name || '').toLowerCase(),
                    (awayTeam?.shortDisplayName || '').toLowerCase(),
                    (awayTeam?.location || '').toLowerCase()
                ].filter(n => n.length > 2);

                const homeNames = [
                    (homeTeam?.displayName || '').toLowerCase(),
                    (homeTeam?.name || '').toLowerCase(),
                    (homeTeam?.shortDisplayName || '').toLowerCase(),
                    (homeTeam?.location || '').toLowerCase()
                ].filter(n => n.length > 2);

                let awayFound = awayNames.some(n => cleanedText.includes(n));
                let homeFound = homeNames.some(n => cleanedText.includes(n));

                if (awayFound && homeFound) {
                    bestMatch = `${awayTeam.shortDisplayName || awayTeam.name} @ ${homeTeam.shortDisplayName || homeTeam.name}`;
                    foundExactPair = true;
                    break;
                }
            }

            if (foundExactPair && bestMatch) {
                return `<span style="color: var(--text-primary); font-weight: 500;">${bestMatch}</span>`;
            }

            return `<span style="color: var(--text-secondary);">NA</span>`;
        }

        function getProviderName(urlStr) {
            try {
                const urlObj = new URL(urlStr);
                let host = urlObj.hostname.replace('www.', '');
                let parts = host.split('.');
                if (parts.length >= 2) {
                    let mainName = parts[parts.length - 2];
                    return mainName.charAt(0).toUpperCase() + mainName.slice(1);
                }
                return host;
            } catch (e) {
                return "Stream";

        function getTeamSpread(teamObj, opponentObj) {
            if (!oddsDataCache) return '';

            const gamesList = Array.isArray(oddsDataCache) 
                ? oddsDataCache 
                : (oddsDataCache.events || oddsDataCache.games || Object.values(oddsDataCache));

            if (!gamesList || gamesList.length === 0) return '';

            const teamNames = [
                teamObj?.displayName,
                teamObj?.name,
                teamObj?.shortDisplayName,
                teamObj?.location
            ].filter(Boolean).map(n => n.toLowerCase().trim());

            const opponentNames = [
                opponentObj?.displayName,
                opponentObj?.name,
                opponentObj?.shortDisplayName,
                opponentObj?.location
            ].filter(Boolean).map(n => n.toLowerCase().trim());

            for (let game of gamesList) {
                if (!game || typeof game !== 'object') continue;

                if (currentLeagueKey === 'cfb') {
                    const sourceLabel = (game.source || '').toLowerCase();
                    const isFcsTabActive = document.getElementById('conference-select')?.value?.includes('groups=81');
                    if (isFcsTabActive && !sourceLabel.includes('fcs')) continue;
                    if (!isFcsTabActive && sourceLabel.includes('fcs')) continue;
                }

                const gameTeam = (game.team || '').toLowerCase().trim();
                const gameOpponent = (game.opponent || '').toLowerCase().trim();
                const spreadVal = game.spread;

                const teamMatches = teamNames.some(n => gameTeam.includes(n) || n.includes(gameTeam));
                const opponentMatches = opponentNames.some(n => gameOpponent.includes(n) || n.includes(gameOpponent));

                if (teamMatches && opponentMatches && spreadVal !== undefined && spreadVal !== null) {
                    const num = parseFloat(spreadVal);
                    if (isNaN(num)) return spreadVal;
                    return num > 0 ? `+${num}` : `${num}`;
                }
            }

            return '';
        }

                    const isManningcast = textLower === 'manningcast' || textLower.includes('manningcast') || siteLower.includes('manningcast') || hrefLower.includes('manningcast');

                    if (isRedzone) {
                        label = `Redzone (${pName})`;
                    } else if (isManningcast) {
                        label = `Manningcast (${pName})`;
                    } else if (providerCounts[pName] > 1) {
                        providerSeenIndices[pName] = (providerSeenIndices[pName] || 0) + 1;
                        label = `${pName} ${providerSeenIndices[pName]}`;
                    }

                    dropdownHtml += `<a href="${link.href}" target="_blank">${label}</a>`;

            } else {
                dropdownHtml += `<a href="#" onclick="return false;" style="color: var(--text-secondary); cursor: default;">No active streams found</a>`;

        function renderMLBWildCard(data) {
            const dynamicArea = getActiveContentContainer();
            let html = '';
            let leagues = [];

            function extractLeagues(node) {
                if (!node) return;
                if (node.children) {
                    node.children.forEach(child => {
                        if (child.children && child.children.some(c => c.standings)) {
                            leagues.push(child);
                        } else {
                            extractLeagues(child);
                        }
                    });
                }
            }

            extractLeagues(data);
            if (leagues.length === 0 && data.children) {
                leagues = data.children;
            }

            if (leagues.length === 0) {
                dynamicArea.innerHTML = `<div class="no-data">No Wild Card standings available.</div>`;
                return;
            }

            leagues.forEach(league => {
                const leagueName = league.name || 'Wild Card';
                let wildcardEntries = [];

                let divisions = [];
                function findDivisions(node) {
                    if (!node) return;
                    if (node.standings && node.standings.entries) {
                        divisions.push(node.standings.entries);
                    }
                    if (node.children) {
                        node.children.forEach(child => findDivisions(child));
                    }
                }
                findDivisions(league);

                divisions.forEach(divEntries => {
                    let sortedDiv = [...divEntries].sort((a, b) => {
                        const aStats = a.stats || [];
                        const bStats = b.stats || [];
                        const aWins = parseInt(aStats.find(s => s.name === 'wins')?.value ?? aStats.find(s => s.name === 'wins')?.displayValue ?? 0);
                        const bWins = parseInt(bStats.find(s => s.name === 'wins')?.value ?? bStats.find(s => s.name === 'wins')?.displayValue ?? 0);
                        const aLosses = parseInt(aStats.find(s => s.name === 'losses')?.value ?? aStats.find(s => s.name === 'losses')?.displayValue ?? 0);
                        const bLosses = parseInt(bStats.find(s => s.name === 'losses')?.value ?? bStats.find(s => s.name === 'losses')?.displayValue ?? 0);
                        
                        if (bWins !== aWins) return bWins - aWins;
                        return aLosses - bLosses;
                    });

                    if (sortedDiv.length > 0) {
                        sortedDiv.shift();
                    }
                    wildcardEntries = wildcardEntries.concat(sortedDiv);
                });

                if (wildcardEntries.length === 0) return;

                wildcardEntries.sort((a, b) => {
                    const aStats = a.stats || [];
                    const bStats = b.stats || [];
                    const aWins = parseInt(aStats.find(s => s.name === 'wins')?.value ?? aStats.find(s => s.name === 'wins')?.displayValue ?? 0);
                    const bWins = parseInt(bStats.find(s => s.name === 'wins')?.value ?? bStats.find(s => s.name === 'wins')?.displayValue ?? 0);
                    const aLosses = parseInt(aStats.find(s => s.name === 'losses')?.value ?? aStats.find(s => s.name === 'losses')?.displayValue ?? 0);
                    const bLosses = parseInt(bStats.find(s => s.name === 'losses')?.value ?? bStats.find(s => s.name === 'losses')?.displayValue ?? 0);
                    
                    if (bWins !== aWins) return bWins - aWins;
                    return aLosses - bLosses;
                });

                const baselineTeam = wildcardEntries[2] || wildcardEntries[wildcardEntries.length - 1];
                let baseWins = 0;
                let baseLosses = 0;

                if (baselineTeam) {
                    const bStats = baselineTeam.stats || [];
                    baseWins = parseInt(bStats.find(s => s.name === 'wins')?.value ?? bStats.find(s => s.name === 'wins')?.displayValue ?? 0);
                    baseLosses = parseInt(bStats.find(s => s.name === 'losses')?.value ?? bStats.find(s => s.name === 'losses')?.displayValue ?? 0);
                }

                html += `
                    <div class="standings-section">
                        <div class="standings-title">${leagueName} Wild Card</div>
                        <table class="standings-table">
                           <thead>
                               <tr>
                                   <th>Team</th>
                                   <th>W</th>
                                   <th>L</th>
                                   <th>GB</th>
                               </tr>
                           </thead>
                           <tbody>
                `;

                wildcardEntries.forEach((entry, idx) => {
                    const team = entry.team || {};
                    const stats = entry.stats || [];
                    const wins = parseInt(stats.find(s => s.name === 'wins')?.value ?? stats.find(s => s.name === 'wins')?.displayValue ?? 0);
                    const losses = parseInt(stats.find(s => s.name === 'losses')?.value ?? stats.find(s => s.name === 'losses')?.displayValue ?? 0);

                    let gbDisplay = '-';
                    if (baselineTeam) {
                        const gbVal = ((baseWins - wins) + (losses - baseLosses)) / 2;
                        if (idx === 2) {
                            gbDisplay = '-';
                        } else if (gbVal === 0) {
                            gbDisplay = '-';
                        } else if (gbVal > 0) {
                            gbDisplay = gbVal % 1 === 0 ? gbVal.toString() : gbVal.toFixed(1);
                        } else {
                            gbDisplay = '+' + (gbVal % 1 === 0 ? Math.abs(gbVal).toString() : Math.abs(gbVal).toFixed(1));
                        }
                    }

                    const teamLogo = team.logo || (team.logos && team.logos[0] && team.logos[0].href) || '';
                    const teamName = team.displayName || team.name || team.shortDisplayName || '';

                    html += `
                        <tr>
                            <td class="team-cell">
                                <img class="team-logo" src="${teamLogo}" alt="" onerror="this.style.display='none'">
                                <span>${teamName}</span>
                            </td>
                            <td>${wins}</td>
                            <td>${losses}</td>
                            <td>${gbDisplay}</td>
                        </tr>
                    `;
                });

                html += `</tbody></table></div>`;
            });

            dynamicArea.innerHTML = html;
        }

        function renderBoxScore(data) {
            const dynamicArea = getActiveContentContainer();
            const competition = data.header?.competitions?.[0] || data.competitions?.[0];
            if (!competition) {
                dynamicArea.innerHTML = `<div class="error">Matchup details not found.</div>`;
                return;
            }

            const competitors = competition.competitors;
            const homeTeam = competitors.find(c => c.homeAway === 'home');
            const awayTeam = competitors.find(c => c.homeAway === 'away');
            const statusDetail = competition.status?.type?.detail || '';

            let html = `
                <div class="boxscore-header">
                    <button class="back-btn" onclick="loadData()">← Back to Scores</button>
                </div>
                <div class="boxscore-matchup-card">
                    <div class="boxscore-game-info">${competition.status?.type?.description || 'Matchup'} • ${statusDetail}</div>
                    <div class="boxscore-teams-row">
                        <div class="boxscore-team">
                            <img src="${awayTeam.team?.logo || ''}" alt="" onerror="this.style.display='none'">
                            <span class="boxscore-team-name">${awayTeam.team?.shortDisplayName || awayTeam.team?.name}</span>
                        </div>
                        <div class="boxscore-score">${awayTeam.score || '0'} - ${homeTeam.score || '0'}</div>
                        <div class="boxscore-team right">
                            <span class="boxscore-team-name">${homeTeam.team?.shortDisplayName || homeTeam.team?.name}</span>
                            <img src="${homeTeam.team?.logo || ''}" alt="" onerror="this.style.display='none'">
                        </div>
                    </div>
                </div>
            `;

            if (data.boxscore && data.boxscore.teams && data.boxscore.teams.length === 2) {
                const awayStats = data.boxscore.teams.find(t => t.team.id === awayTeam.id)?.statistics || [];
                const homeStats = data.boxscore.teams.find(t => t.team.id === homeTeam.id)?.statistics || [];

                const hasValidStats = awayStats.length > 0 && awayStats.some(s => s.label && s.displayValue !== undefined);

                if (hasValidStats) {
                    const statMap = new Map();
                    
                    awayStats.forEach(s => {
                        const key = (s.name || s.label || '').toLowerCase().trim();
                        statMap.set(key, { away: s.displayValue, label: s.label, name: s.name });
                    });
                    
                    homeStats.forEach(s => {
                        const key = (s.name || s.label || '').toLowerCase().trim();
                        if (statMap.has(key)) {
                            statMap.get(key).home = s.displayValue;
                        } else {
                            statMap.set(key, { home: s.displayValue, label: s.label, name: s.name });
                        }
                    });

                    const extractStat = (identifiers) => {
                        for (let [k, val] of statMap.entries()) {
                            for (let id of identifiers) {
                                if (k === id || k.includes(id)) {
                                    statMap.delete(k);
                                    return val;
                                }
                            }
                        }
                        return null;
                    };

                    const totalYardsObj = extractStat(['total yards', 'totalyards']);
                    
                    let passingObj = null;
                    let rushingObj = null;

                    for (let [k, val] of statMap.entries()) {
                        if ((k === 'passing yards' || k === 'net passing yards' || k === 'passingnet yards') || 
                            (k.includes('passing') && !k.includes('first') && !k.includes('touchdown') && !k.includes('attempt') && !k.includes('completion') && !k.includes('interception'))) {
                            passingObj = val;
                            statMap.delete(k);
                            break;
                        }
                    }

                    for (let [k, val] of statMap.entries()) {
                        if ((k === 'rushing yards') || 
                            (k.includes('rushing') && !k.includes('first') && !k.includes('touchdown') && !k.includes('attempt'))) {
                            rushingObj = val;
                            statMap.delete(k);
                            break;
                        }
                    }

                    const firstDownsObj = extractStat(['first downs', 'firstdowns']);
                    const thirdDownObj = extractStat(['3rd down efficiency', 'third down efficiency', '3rddown']);
                    const fourthDownObj = extractStat(['4th down efficiency', 'fourth down efficiency', '4thdown']);
                    const redzoneObj = extractStat(['red zone', 'redzone']);
                    const penaltiesObj = extractStat(['penalties', 'penaltiesyards']);
                    const sacksObj = extractStat(['sacks', 'sacks-yards lost', 'sacksyardslost']);
                    const turnoversObj = extractStat(['turnovers', 'to']);
                    const possessionObj = extractStat(['possession', 'possessiontime']);

                    const configuredOrder = [
                        { obj: totalYardsObj, label: 'Total Yards' },
                        { obj: passingObj, label: 'Passing' },
                        { obj: rushingObj, label: 'Rushing' },
                        { obj: firstDownsObj, label: '1st Downs' },
                        { obj: thirdDownObj, label: '3rd Downs' },
                        { obj: fourthDownObj, label: '4th Downs' },
                        { obj: redzoneObj, label: 'Redzone' },
                        { obj: penaltiesObj, label: 'Penalties' },
                        { obj: sacksObj, label: 'Sacks' },
                        { obj: turnoversObj, label: 'TOs' },
                        { obj: possessionObj, label: 'Possession' }
                    ];

                    html += `
                        <div class="standings-section">
                            <div class="standings-title">Team Statistics</div>
                            <div class="table-responsive">
                                <table class="comparison-table">
                                    <thead>
                                        <tr>
                                            <th style="width: 30%; text-align: left;">${awayTeam.team?.shortDisplayName || 'Away'}</th>
                                            <th style="width: 40%; text-align: center;">Stat</th>
                                            <th style="width: 30%; text-align: right;">${homeTeam.team?.shortDisplayName || 'Home'}</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                    `;

                    configuredOrder.forEach(item => {
                        if (item.obj) {
                            const awayVal = item.obj.away !== undefined ? item.obj.away : '-';
                            const homeVal = item.obj.home !== undefined ? item.obj.home : '-';
                            html += `
                                <tr>
                                    <td style="text-align: left; font-weight: 600;">${awayVal}</td>
                                    <td style="text-align: center; color: var(--text-secondary);">${item.label}</td>
                                    <td style="text-align: right; font-weight: 600;">${homeVal}</td>
                                </tr>
                            `;
                        }
                    });

                    html += `</tbody></table></div></div>`;
                }
            }

            if (data.boxscore && data.boxscore.players) {
                let teamOptionsHtml = '';
                data.boxscore.players.forEach((pTeam, idx) => {
                    const teamName = pTeam.team.shortDisplayName || pTeam.team.displayName || 'Team';
                    teamOptionsHtml += `<option value="${pTeam.team.id}">${teamName}</option>`;

                html += `
                    <div style="margin-top: 24px;">
                        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; flex-wrap: wrap; gap: 8px;">
                            <h3 style="font-size: 1.1rem;">Player Statistics</h3>
                            <select id="player-team-select" onchange="handlePlayerTeamChange()" style="font-weight: 600;">
                                ${teamOptionsHtml}
                            </select>
                        </div>
                        <div id="player-stats-container"></div>
                    </div>
                `;
            }

            dynamicArea.innerHTML = html;
            if (data.boxscore && data.boxscore.players && data.boxscore.players.length > 0) {
                renderPlayerStatsForTeam(data.boxscore.players[0].team.id);
            }
        }

        function renderProStandings(data) {
            const dynamicArea = getActiveContentContainer();
            let html = '';
            let divisions = [];
            
            function extractDivisions(node) {
                if (!node) return;
                if (node.standings && node.standings.entries) {
                    divisions.push({ name: node.name || 'Division', entries: node.standings.entries });
                }
                if (node.entries) {
                    divisions.push({ name: node.name || 'Division', entries: node.entries });
                }
                if (node.children) {
                    node.children.forEach(child => extractDivisions(child));
                }
            }

            if (data.children) {
                data.children.forEach(child => extractDivisions(child));
            } else if (data.standings) {
                extractDivisions(data);
            }

            if (divisions.length === 0) {
                dynamicArea.innerHTML = `<div class="no-data">No pro standings available.</div>`;
                return;
            }

            divisions.forEach(div => {
                div.entries.sort((a, b) => {
                    const aStats = a.stats || [];
                    const bStats = b.stats || [];
                    const aWins = parseInt(aStats.find(s => s.name === 'wins')?.value ?? aStats.find(s => s.name === 'wins')?.displayValue ?? 0);
                    const bWins = parseInt(bStats.find(s => s.name === 'wins')?.value ?? bStats.find(s => s.name === 'wins')?.displayValue ?? 0);
                    const aLosses = parseInt(aStats.find(s => s.name === 'losses')?.value ?? aStats.find(s => s.name === 'losses')?.displayValue ?? 0);
                    const bLosses = parseInt(bStats.find(s => s.name === 'losses')?.value ?? bStats.find(s => s.name === 'losses')?.displayValue ?? 0);
                    
                    if (bWins !== aWins) return bWins - aWins;
                    return aLosses - bLosses;
                });

                html += `
                    <div class="standings-section">
                        <div class="standings-title">${div.name}</div>
                        <table class="standings-table">
                           <thead>
                               <tr>
                                   <th>Team</th>
                                   <th>W</th>
                                   <th>L</th>
                                   <th>GB</th>
                               </tr>
                           </thead>
                           <tbody>
                `;

                div.entries.forEach(entry => {
                    const team = entry.team || {};
                    const stats = entry.stats || [];
                    const wins = stats.find(s => s.name === 'wins')?.displayValue || '-';
                    const losses = stats.find(s => s.name === 'losses')?.displayValue || '-';
                    const gb = stats.find(s => s.name === 'gamesBehind')?.displayValue || '-';

                    const teamLogo = team.logo || (team.logos && team.logos[0] && team.logos[0].href) || '';
                    const teamName = team.displayName || team.name || team.shortDisplayName || '';

                    html += `
                        <tr>
                            <td class="team-cell">
                                <img class="team-logo" src="${teamLogo}" alt="" onerror="this.style.display='none'">
                                <span>${teamName}</span>
                            </td>
                            <td>${wins}</td>
                            <td>${losses}</td>
                            <td>${gb}</td>
                        </tr>
                    `;
                });

                html += `</tbody></table></div>`;
            });

            dynamicArea.innerHTML = html;
        }

        function renderFilteredCollegeStandings(data, confName, targetGroupId) {
            const dynamicArea = getActiveContentContainer();
            let matchedEntries = [];

            function findGroupEntries(node) {
                if (!node) return;
                
                const nodeId = node.id ? node.id.toString() : '';
                const nodeName = (node.shortName || node.name || '').toLowerCase();
                
                if ((targetGroupId && nodeId === targetGroupId) || nodeName === confName.toLowerCase()) {
                    if (node.standings && node.standings.entries) {
                        matchedEntries = node.standings.entries;
                        return;
                    } else if (node.entries) {
                        matchedEntries = node.entries;
                        return;
                    }
                }

                if (node.children) {
                    node.children.forEach(child => findGroupEntries(child));
                }
            }

            findGroupEntries(data);

            if (matchedEntries.length === 0 && data.groups) {
                const targetGroup = data.groups.find(g => (g.id && g.id.toString() === targetGroupId) || (g.name || '').toLowerCase() === confName.toLowerCase());
                if (targetGroup && targetGroup.standings && targetGroup.standings.entries) {
                    matchedEntries = targetGroup.standings.entries;
                }
            }

            if (matchedEntries.length === 0) {
                dynamicArea.innerHTML = `<div class="no-data">No standings available for ${confName}.</div>`;
                return;
            }

            let html = `
                <div class="standings-section">
                    <div class="standings-title">${confName} Standings</div>
                    <table class="standings-table">
                       <thead>
                           <tr>
                               <th>Team</th>
                               <th>Conf W-L</th>
                               <th>Overall W-L</th>
                           </tr>
                       </thead>
                       <tbody>
            `;

            matchedEntries.evaluate = matchedEntries.forEach(entry => {
                const team = entry.team || {};
                const stats = entry.stats || [];
                const confRecord = stats.find(s => s.name === 'conference' || s.abbreviation === 'CONF')?.displayValue || '-';
                const overallRecord = stats.find(s => s.name === 'overall' || s.abbreviation === 'OVERALL')?.displayValue || '-';

                const teamLogo = team.logo || (team.logos && team.logos[0] && team.logos[0].href) || '';
                const teamName = team.displayName || team.name || team.shortDisplayName || '';

                html += `
                    <tr>
                        <td class="team-cell">
                            <img class="team-logo" src="${teamLogo}" alt="" onerror="this.style.display='none'">
                            <span>${teamName}</span>
                        </td>
                        <td>${confRecord}</td>
                        <td>${overallRecord}</td>
                    </tr>
                `;
            });

            html += `</tbody></table></div>`;
            dynamicArea.innerHTML = html;
        }

        function renderCollegeRankings(data, targetType) {
            const dynamicArea = getActiveContentContainer();
            const rankingsList = data.rankings || [];
            
            let poll = rankingsList.find(p => {
                const name = (p.name || p.headline || '').toLowerCase();
                return name.includes('ap') || name.includes('fbs') || p.type === 'ap';
            }) || rankingsList[0];

            if (!poll || !poll.ranks) {
                dynamicArea.innerHTML = `<div class="no-data">Rankings currently unavailable.</div>`;
                return;
            }

            renderSpecificPoll(poll, `Current Top 25 ${targetType} Rankings (${poll.name || 'Poll'})`, false);
        }

        function renderSpecificPoll(poll, titleText, useSchoolName = false) {
            const dynamicArea = getActiveContentContainer();
            let html = `
                <div class="standings-section">
                    <div class="standings-title">${titleText}</div>
                    <table class="standings-table">
                       <thead>
                           <tr>
                               <th>Rank</th>
                               <th>Team</th>
                               <th>Record</th>
                           </tr>
                     </thead>
                       <tbody>
            `;

            poll.ranks.forEach(rank => {
                const team = rank.team || {};
                const teamLogo = team.logo || (team.logos && team.logos[0] && team.logos[0].href) || '';
                let teamName = team.displayName || team.name || team.shortDisplayName || '';

                if (useSchoolName) {
                    teamName = team.location || team.nickname || team.displayName || team.name || '';
                }

                html += `
                    <tr>
                        <td style="font-weight: 700; width: 60px;">#${rank.current}</td>
                        <td class="team-cell">
                            <img class="team-logo" src="${teamLogo}" alt="" onerror="this.style.display='none'">
                            <span>${teamName}</span>
                        </td>
                        <td>${rank.recordSummary || '-'}</td>
                    </tr>
                `;
            });

            html += `</tbody></table></div>`;
            dynamicArea.innerHTML = html;
        }

        backgroundPrefetch().then(() => {
            switchLeague('nfl', document.querySelector('.tab-btn'));
        });

        setInterval(() => {
            if (!isShowingStandings && currentLeagueKey && currentLeagueKey !== 'test' && currentView === 'hub') {
                fetchScores();
            }
        }, 30000);
    </script>
</body>
</html>
