<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sports Dashboard</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent: #38bdf8;
            --border: #334155;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 16px;
        }

        header {
            margin-bottom: 20px;
        }

        h1 {
            font-size: 1.5rem;
            margin: 0 0 12px 0;
        }

        /* Tabs Navigation */
        .tabs {
            display: flex;
            gap: 8px;
            border-bottom: 1px solid var(--border);
            padding-bottom: 8px;
            overflow-x: auto;
        }

        .tab-btn {
            background: transparent;
            border: none;
            color: var(--text-muted);
            padding: 8px 16px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            border-radius: 6px;
            transition: all 0.2s ease;
            white-space: nowrap;
        }

        .tab-btn.active {
            background-color: var(--accent);
            color: var(--bg-color);
        }

        /* Content Area */
        .content-container {
            margin-top: 20px;
        }

        .standings-section {
            background-color: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 16px;
        }

        .standings-title {
            font-size: 1.1rem;
            font-weight: 700;
            margin-bottom: 12px;
            color: var(--text-main);
        }

        .test-controls {
            margin-bottom: 12px;
        }

        .test-btn {
            background-color: var(--accent);
            color: var(--bg-color);
            border: none;
            padding: 8px 14px;
            font-weight: 600;
            border-radius: 6px;
            cursor: pointer;
        }

        .table-responsive {
            width: 100%;
            overflow-x: auto;
        }

        .standings-table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
            font-size: 0.85rem;
        }

        .standings-table th, .standings-table td {
            padding: 10px 12px;
            border-bottom: 1px solid var(--border);
        }

        .standings-table th {
            color: var(--text-muted);
            font-weight: 600;
            background-color: rgba(255, 255, 255, 0.02);
        }

        .loading, .no-data {
            color: var(--text-muted);
            font-style: italic;
            padding: 20px 0;
            text-align: center;
        }
    </style>
</head>
<body>

    <header>
        <h1>Sports Dashboard</h1>
        <!-- Tabs Navigation -->
        <div class="tabs">
            <button class="tab-btn" onclick="switchTab('dashboard')">Dashboard</button>
            <button class="tab-btn active" id="default-tab" onclick="switchTab('test')">Test</button>
        </div>
    </header>

    <main id="content-area" class="content-container">
        <!-- Dynamic Content Renders Here -->
    </main>

    <script>
        // Simple tab switching coordinator
        function switchTab(tabName) {
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            
            if (tabName === 'test') {
                document.querySelector('.tabs button:nth-child(2)').classList.add('active');
                renderTestTabInterface();
            } else {
                document.querySelector('.tabs button:nth-child(1)').classList.add('active');
                document.getElementById('content-area').innerHTML = `
                    <div class="standings-section">
                        <div class="standings-title">Main Dashboard</div>
                        <div style="color: var(--text-muted);">Select the Test tab to view scraped live stream links.</div>
                    </div>
                `;
            }
        }

        async function renderTestTabInterface() {
            const contentArea = document.getElementById('content-area');
            
            contentArea.innerHTML = `
                <div class="standings-section">
                    <div class="standings-title">Scraped Competition Links</div>
                    <div class="test-controls">
                        <button class="test-btn" onclick="loadScrapedLinksJson()">Reload links.json</button>
                    </div>
                    <div id="parser-results-container">
                        <div class="loading">Loading links.json...</div>
                    </div>
                </div>
            `;
            await loadScrapedLinksJson();
        }

        async function loadScrapedLinksJson() {
            const container = document.getElementById('parser-results-container');
            container.innerHTML = '<div class="loading">Fetching latest links...</div>';
            
            try {
                // Fetch the json file generated by your GitHub Action (cache-busting applied)
                const response = await fetch('./links.json?t=' + new Date().getTime());
                if (!response.ok) throw new Error('links.json not found yet. Run the GitHub Action first!');
                const data = await response.json();
                
                renderLinksTable(data.links);
            } catch (err) {
                container.innerHTML = `<div class="no-data">Could not load links.json: ${err.message}<br><small>Make sure your GitHub Action has successfully run and committed links.json.</small></div>`;
            }
        }

        function renderLinksTable(links) {
            const resultsContainer = document.getElementById('parser-results-container');
            if (!links || links.length === 0) {
                resultsContainer.innerHTML = '<div class="no-data">No links found in links.json.</div>';
                return;
            }

            let html = `
                <div style="font-size: 0.85rem; font-weight: 600; margin-bottom: 8px; color: var(--accent);">Loaded ${links.length} HREFs across sources:</div>
                <div class="table-responsive">
                    <table class="standings-table">
                        <thead>
                            <tr>
                                <th style="width: 25%;">Source Website</th>
                                <th style="width: 35%;">Link Text</th>
                                <th style="width: 40%;">Href Target</th>
                            </tr>
                        </thead>
                        <tbody>
            `;

            links.forEach(item => {
                // Shorten the source URL display for clean table layout on mobile
                let shortSource = item.source_site ? item.source_site.split('/').pop() : 'Unknown';
                html += `
                    <tr>
                        <td style="font-size: 0.8rem; color: var(--text-muted); font-weight: 500;">${shortSource}</td>
                        <td style="font-weight: 500;">${item.text || '(No text)'}</td>
                        <td><a href="${item.href}" target="_blank" style="color: var(--accent); text-decoration: none; word-break: break-all;">${item.href}</a></td>
                    </tr>
                `;
            });

            html += `</tbody></table></div>`;
            resultsContainer.innerHTML = html;
        }

        // Initialize on load to default to Test tab view
        window.onload = () => {
            renderTestTabInterface();
        };
    </script>
</body>
</html>
