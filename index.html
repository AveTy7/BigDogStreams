<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Sports Scores Hub</title>
    <style>
        :root {
            --bg-primary: #0f172a;
            --bg-secondary: #1e293b;
            --bg-card: #1e293b;
            --bg-card-hover: #334155;
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --accent: #38bdf8;
            --accent-hover: #0ea5e9;
            --border: #334155;
            --success: #22c55e;
            --danger: #ef4444;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            background-color: var(--bg-secondary);
            border-bottom: 1px solid var(--border);
            padding: 1rem 2rem;
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .header-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        h1 {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--text-primary);
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .nav-tabs {
            display: flex;
            gap: 0.5rem;
            overflow-x: auto;
            padding-bottom: 0.25rem;
        }

        .tab-btn {
            background-color: transparent;
            border: 1px solid var(--border);
            color: var(--text-secondary);
            padding: 0.5rem 1rem;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            white-space: nowrap;
        }

        .tab-btn:hover {
            background-color: var(--bg-card-hover);
            color: var(--text-primary);
        }

        .tab-btn.active {
            background-color: var(--accent);
            border-color: var(--accent);
            color: var(--bg-primary);
        }

        .filter-container {
            display: none;
            gap: 1rem;
            align-items: center;
            padding: 0.75rem 2rem;
            background-color: rgba(30, 41, 59, 0.5);
            border-bottom: 1px solid var(--border);
        }

        .filter-container.visible {
            display: flex;
        }

        select {
            background-color: var(--bg-secondary);
            color: var(--text-primary);
            border: 1px solid var(--border);
            padding: 0.4rem 0.8rem;
            border-radius: 4px;
            outline: none;
            cursor: pointer;
        }

        select:focus {
            border-color: var(--accent);
        }

        main {
            flex: 1;
            padding: 2rem;
            max-width: 1400px;
            margin: 0 auto;
            width: 100%;
        }

        .loading, .no-data {
            text-align: center;
            color: var(--text-secondary);
            padding: 4rem;
            font-size: 1.1rem;
        }

        /* Standings / Scraped Links Table Styles */
        .standings-section {
            background-color: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 1.5rem;
            margin-bottom: 2rem;
        }

        .standings-title {
            font-size: 1.25rem;
            font-weight: 600;
            margin-bottom: 1rem;
            color: var(--text-primary);
        }

        .table-responsive {
            overflow-x: auto;
        }

        .standings-table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
            font-size: 0.95rem;
        }

        .standings-table th, .standings-table td {
            padding: 0.75rem 1rem;
            border-bottom: 1px solid var(--border);
        }

        .standings-table th {
            background-color: rgba(15, 23, 42, 0.4);
            color: var(--text-secondary);
            font-weight: 600;
        }

        .standings-table tr:hover {
            background-color: var(--bg-card-hover);
        }

        footer {
            text-align: center;
            padding: 1rem;
            color: var(--text-secondary);
            font-size: 0.85rem;
            border-top: 1px solid var(--border);
            background-color: var(--bg-secondary);
        }
    </style>
</head>
<body>

    <header>
        <div class="header-top">
            <h1>🏆 Live Sports Scores Hub</h1>
        </div>
        <div class="nav-tabs" id="nav-tabs">
            <button class="tab-btn active" onclick="switchLeague('nfl', this)">NFL</button>
            <button class="tab-btn" onclick="switchLeague('nba', this)">NBA</button>
            <button class="tab-btn" onclick="switchLeague('mlb', this)">MLB</button>
            <button class="tab-btn" onclick="switchLeague('cfb', this)">CFB</button>
            <button class="tab-btn" onclick="switchLeague('cbb', this)">CBB</button>
            <button class="tab-btn" onclick="switchLeague('test', this)">Test</button>
        </div>
    </header>

    <div class="filter-container" id="filter-container">
        <label for="conference-select" style="color: var(--text-secondary); font-size: 0.9rem;">Conference/Filter:</label>
        <select id="conference-select" onchange="handleFilterChange()">
            <option value="">All Conferences</option>
        </select>
    </div>

    <main id="content-area">
        <div class="loading">Select a league above to load scores.</div>
    </main>

    <footer>
        Live Sports Scores Hub &bull; Powered by ESPN APIs & GitHub Actions
    </footer>

    <script>
        const endpoints = {
            nfl: { type: 'scoreboard', sport: 'football', league: 'nfl', conferences: null },
            nba: { type: 'scoreboard', sport: 'basketball', league: 'nba', conferences: null },
            mlb: { type: 'scoreboard', sport: 'baseball', league: 'mlb', conferences: null },
            cfb: { type: 'scoreboard', sport: 'football', league: 'college-football', conferences: null },
            cbb: { type: 'scoreboard', sport: 'basketball', league: 'mens-college-basketball', conferences: null },
            test: { type: 'test', conferences: null }
        };

        let currentLeagueKey = 'nfl';
        let isShowingStandings = false;

        function switchLeague(leagueKey, buttonElement) {
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            buttonElement.classList.add('active');

            currentLeagueKey = leagueKey;
            isShowingStandings = false;

            const filterContainer = document.getElementById('filter-container');

            if (leagueKey === 'test') {
                filterContainer.classList.remove('visible');
                loadScrapedLinksJson();
                return;
            }

            filterContainer.classList.add('visible');
            loadScoreboard(leagueKey);
        }

        function handleFilterChange() {
            // Placeholder for standard league filtering logic
        }

        function loadScoreboard(leagueKey) {
            const contentArea = document.getElementById('content-area');
            contentArea.innerHTML = `<div class="loading">Loading ${leagueKey.toUpperCase()} data...</div>`;
            // Standard scoreboard fetch logic goes here for ESPN leagues
        }

        async function loadScrapedLinksJson() {
            const contentArea = document.getElementById('content-area');
            contentArea.innerHTML = '<div class="loading">Loading links.json...</div>';
            
            try {
                const response = await fetch('./links.json?t=' + new Date().getTime());
                if (!response.ok) throw new Error('links.json not found yet. Run your GitHub Action first!');
                const data = await response.json();
                
                renderScrapedLinksTable(data.links);
            } catch (err) {
                contentArea.innerHTML = `<div class="no-data">Could not load links.json: ${err.message}<br><small>Make sure your GitHub Action has run and committed links.json to the repository.</small></div>`;
            }
        }

        function renderScrapedLinksTable(links) {
            const contentArea = document.getElementById('content-area');
            if (!links || links.length === 0) {
                contentArea.innerHTML = '<div class="no-data">No links found in links.json.</div>';
                return;
            }

            let html = `
                <div class="standings-section">
                    <div class="standings-title" style="display: flex; justify-content: space-between; align-items: center;">
                        <span>Scraped Stream Links (${links.length})</span>
                        <button class="tab-btn" onclick="loadScrapedLinksJson()" style="padding: 4px 10px; font-size: 0.8rem;">Reload</button>
                    </div>
                    <div class="table-responsive">
                        <table class="standings-table">
                            <thead>
                                <tr>
                                    <th>Source Website</th>
                                    <th>Link Text</th>
                                    <th>Target URL</th>
                                </tr>
                            </thead>
                            <tbody>
            `;

            links.forEach(item => {
                let shortSource = item.source_site ? item.source_site.split('/').pop() : 'Unknown';
                html += `
                    <tr>
                        <td style="font-size: 0.8rem; color: var(--text-secondary);">${shortSource}</td>
                        <td style="font-weight: 600;">${item.text || '(No text)'}</td>
                        <td><a href="${item.href}" target="_blank" style="color: var(--accent); text-decoration: none; word-break: break-all;">${item.href}</a></td>
                    </tr>
                `;
            });

            html += `</tbody></table></div></div>`;
            contentArea.innerHTML = html;
        }

        // Initial load on startup
        window.addEventListener('DOMContentLoaded', () => {
            // Default to NFL or keep initial state
        });
    </script>
</body>
</html>
