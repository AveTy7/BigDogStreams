<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Sports Hub</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --card-hover: #334155;
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --accent: #3b82f6;
            --accent-hover: #2563eb;
            --live-color: #ef4444;
            --final-color: #64748b;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            min-height: 100vh;
            padding: 20px;
        }

        header {
            text-align: center;
            margin-bottom: 24px;
        }

        h1 {
            font-size: 1.8rem;
            margin-bottom: 6px;
            letter-spacing: -0.5px;
        }

        p.subtitle {
            color: var(--text-secondary);
            font-size: 0.9rem;
        }

        /* League Navigation Tabs */
        .tabs {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin-bottom: 16px;
            flex-wrap: wrap;
        }

        .tab-btn {
            background-color: var(--card-bg);
            color: var(--text-secondary);
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .tab-btn:hover {
            background-color: var(--card-hover);
            color: var(--text-primary);
        }

        .tab-btn.active {
            background-color: var(--accent);
            color: white;
        }

        /* Filter & Action Bar */
        .filter-container {
            display: none;
            justify-content: center;
            align-items: center;
            gap: 12px;
            margin-bottom: 24px;
            flex-wrap: wrap;
        }

        .filter-container.visible {
            display: flex;
        }

        .conference-select, .action-btn {
            background-color: var(--card-bg);
            color: var(--text-primary);
            border: 1px solid var(--card-hover);
            padding: 8px 16px;
            border-radius: 8px;
            font-size: 0.9rem;
            outline: none;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .conference-select:hover, .action-btn:hover {
            background-color: var(--card-hover);
        }

        .action-btn.standings-active {
            background-color: var(--accent);
            border-color: var(--accent);
        }

        /* Main Container & Loading States */
        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        .loading, .error, .no-data {
            text-align: center;
            padding: 40px;
            color: var(--text-secondary);
            font-size: 1rem;
        }

        /* Games Grid */
        .games-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 16px;
        }

        .game-card {
            background-color: var(--card-bg);
            border-radius: 12px;
            padding: 16px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            position: relative;
            overflow: hidden;
        }

        .game-status-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            margin-bottom: 12px;
            letter-spacing: 0.5px;
        }

        .status-live {
            color: var(--live-color);
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .pulse-dot {
            width: 8px;
            height: 8px;
            background-color: var(--live-color);
            border-radius: 50%;
            display: inline-block;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(0.95); opacity: 0.9; }
            50% { transform: scale(1.3); opacity: 0.4; }
            100% { transform: scale(0.95); opacity: 0.9; }
        }

        .status-scheduled {
            color: var(--text-secondary);
        }

        .status-final {
            color: var(--final-color);
        }

        .teams-container {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .team-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .team-info {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .team-logo {
            width: 24px;
            height: 24px;
            object-fit: contain;
        }

        .team-name {
            font-size: 0.95rem;
            font-weight: 500;
        }

        .team-score {
            font-size: 1.1rem;
            font-weight: 700;
        }

        .card-footer {
            margin-top: 14px;
            padding-top: 8px;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            font-size: 0.75rem;
            color: var(--text-secondary);
            text-align: right;
        }

        /* Standings / Rankings Styling */
        .standings-section {
            background-color: var(--card-bg);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 16px;
        }

        .standings-title {
            font-size: 1.1rem;
            font-weight: 700;
            margin-bottom: 12px;
            color: var(--text-primary);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            padding-bottom: 8px;
        }

        .standings-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.9rem;
        }

        .standings-table th, .standings-table td {
            padding: 8px 12px;
            text-align: left;
        }

        .standings-table th {
            color: var(--text-secondary);
            font-weight: 600;
            font-size: 0.8rem;
            text-transform: uppercase;
        }

        .standings-table tr:not(:last-child) td {
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .standings-table td.team-cell {
            display: flex;
            align-items: center;
            gap: 10px;
        }
    </style>
</head>
<body>

    <header>
        <h1>Live Sports Scores Hub</h1>
        <p class="subtitle">Live updates, schedules, results, and standings via ESPN</p>
    </header>

    <!-- League Selection Tabs -->
    <div class="tabs">
        <button class="tab-btn active" onclick="switchLeague('nfl', this)">NFL</button>
        <button class="tab-btn" onclick="switchLeague('nba', this)">NBA</button>
        <button class="tab-btn" onclick="switchLeague('mlb', this)">MLB</button>
        <button class="tab-btn" onclick="switchLeague('cfb', this)">CFB</button>
        <button class="tab-btn" onclick="switchLeague('cbb', this)">CBB</button>
    </div>

    <!-- Filter & Standings Toggle Bar -->
    <div id="filter-container" class="filter-container">
        <select id="conference-select" class="conference-select" onchange="handleFilterChange()">
            <!-- Populated dynamically -->
        </select>
        <button id="standings-toggle-btn" class="action-btn" onclick="toggleStandingsView()">View Standings</button>
    </div>

    <div class="container">
        <div id="content-area">
            <div class="loading">Loading games...</div>
        </div>
    </div>

    <script>
        const endpoints = {
            nfl: { sport: 'football', league: 'nfl', conferences: null },
            nba: { sport: 'basketball', league: 'nba', conferences: null },
            mlb: { sport: 'baseball', league: 'mlb', conferences: null },
            cfb: { 
                sport: 'football', 
                league: 'college-football', 
                conferences: [
                    { name: 'All FBS', param: '?groups=80', type: 'rankings' },
                    { name: 'FCS', param: '?groups=81', type: 'rankings-fcs' },
                    { name: 'SEC', param: '?groups=8', type: 'standings', groupId: '8' },
                    { name: 'Big Ten', param: '?groups=5', type: 'standings', groupId: '5' },
                    { name: 'Big 12', param: '?groups=1', type: 'standings', groupId: '1' },
                    { name: 'ACC', param: '?groups=151', type: 'standings', groupId: '151' },
                    { name: 'FBS Independents', param: '?groups=112', type: 'standings', groupId: '112' }
                ]
            },
            cbb: { 
                sport: 'basketball', 
                league: 'mens-college-basketball', 
                conferences: [
                    { name: 'All Top Tier (Div I)', param: '?groups=50', type: 'rankings' },
                    { name: 'SEC', param: '?groups=23', type: 'standings', groupId: '23' },
                    { name: 'Big Ten', param: '?groups=7', type: 'standings', groupId: '7' },
                    { name: 'Big 12', param: '?groups=8', type: 'standings', groupId: '8' },
                    { name: 'ACC', param: '?groups=2', type: 'standings', groupId: '2' },
                    { name: 'Big East', param: '?groups=4', type: 'standings', groupId: '4' }
                ]
            }
        };

        let currentLeagueKey = 'nfl';
        let isShowingStandings = false;

        async function loadData() {
            const contentArea = document.getElementById('content-area');
            contentArea.innerHTML = '<div class="loading">Loading...</div>';

            if (isShowingStandings) {
                await fetchStandings();
            } else {
                await fetchScores();
            }
        }

        async function fetchScores() {
            const cfg = endpoints[currentLeagueKey];
            const contentArea = document.getElementById('content-area');
            
            let queryParam = '';
            if (cfg.conferences) {
                const conferenceSelect = document.getElementById('conference-select');
                queryParam = conferenceSelect.value || cfg.conferences[0].param;
            }

            const url = `https://site.api.espn.com/apis/site/v2/sports/${cfg.sport}/${cfg.league}/scoreboard${queryParam}`;

            try {
                const response = await fetch(url);
                if (!response.ok) throw new Error('Failed to fetch sports data');
                const data = await response.json();
                renderGames(data.events);
            } catch (error) {
                console.error(error);
                contentArea.innerHTML = `<div class="error">Unable to load scores right now. Please try again later.</div>`;
            }
        }

        async function fetchStandings() {
            const cfg = endpoints[currentLeagueKey];
            const contentArea = document.getElementById('content-area');

            if (cfg.conferences) {
                const conferenceSelect = document.getElementById('conference-select');
                const selectedIndex = conferenceSelect.selectedIndex;
                const selectedConf = cfg.conferences[selectedIndex];

                if (selectedConf && selectedConf.type === 'rankings') {
                    // FBS Top 25 Rankings
                    const url = `https://site.api.espn.com/apis/site/v2/sports/${cfg.sport}/${cfg.league}/rankings`;
                    try {
                        const res = await fetch(url);
                        const data = await res.json();
                        renderRankings(data, 'FBS');
                        return;
                    } catch (e) {
                        console.error(e);
                    }
                } else if (selectedConf && selectedConf.type === 'rankings-fcs') {
                    // FCS Top 25 Rankings endpoint
                    const url = `https://site.api.espn.com/apis/site/v2/sports/${cfg.sport}/${cfg.league}/rankings?seasontype=2`;
                    try {
                        const res = await fetch(url);
                        const data = await res.json();
                        renderRankings(data, 'FCS');
                        return;
                    } catch (e) {
                        console.error(e);
                    }
                } else if (selectedConf && selectedConf.type === 'standings') {
                    // Specific Conference Standings
                    const url = `https://site.api.espn.com/apis/v2/sports/${cfg.sport}/${cfg.league}/standings?group=${selectedConf.groupId}`;
                    try {
                        const res = await fetch(url);
                        const data = await res.json();
                        renderStandings(data, selectedConf.name);
                        return;
                    } catch (e) {
                        console.error(e);
                    }
                }
            }

            // Pro Standings (NFL, NBA, MLB)
            const url = `https://site.api.espn.com/apis/v2/sports/${cfg.sport}/${cfg.league}/standings`;
            try {
                const response = await fetch(url);
                if (!response.ok) throw new Error('Failed to fetch standings');
                const data = await response.json();
                renderStandings(data, null);
            } catch (error) {
                console.error(error);
                contentArea.innerHTML = `<div class="error">Unable to load standings right now.</div>`;
            }
        }

        function switchLeague(leagueKey, buttonElement) {
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            buttonElement.classList.add('active');

            currentLeagueKey = leagueKey;
            isShowingStandings = false;
            updateStandingsButtonState();

            const cfg = endpoints[leagueKey];
            const filterContainer = document.getElementById('filter-container');
            const conferenceSelect = document.getElementById('conference-select');

            if (cfg.conferences) {
                conferenceSelect.innerHTML = '';
                cfg.conferences.forEach(conf => {
                    const option = document.createElement('option');
                    option.value = conf.param;
                    option.textContent = conf.name;
                    conferenceSelect.appendChild(option);
                });
                filterContainer.classList.add('visible');
            } else {
                filterContainer.classList.remove('visible');
            }

            loadData();
        }

        function handleFilterChange() {
            isShowingStandings = false;
            updateStandingsButtonState();
            loadData();
        }

        function toggleStandingsView() {
            isShowingStandings = !isShowingStandings;
            updateStandingsButtonState();
            loadData();
        }

        function updateStandingsButtonState() {
            const btn = document.getElementById('standings-toggle-btn');
            const cfg = endpoints[currentLeagueKey];
            
            if (cfg.conferences) {
                const conferenceSelect = document.getElementById('conference-select');
                const selectedConf = cfg.conferences[conferenceSelect.selectedIndex];
                if (selectedConf && (selectedConf.type === 'rankings' || selectedConf.type === 'rankings-fcs')) {
                    btn.textContent = isShowingStandings ? 'View Scores' : 'View Top 25 Rankings';
                } else {
                    btn.textContent = isShowingStandings ? 'View Scores' : 'View Standings';
                }
            } else {
                btn.textContent = isShowingStandings ? 'View Scores' : 'View Standings';
            }

            if (isShowingStandings) {
                btn.classList.add('standings-active');
            } else {
                btn.classList.remove('standings-active');
            }
        }

        function renderGames(events) {
            const contentArea = document.getElementById('content-area');

            if (!events || events.length === 0) {
                contentArea.innerHTML = `<div class="no-data">No games scheduled or available for this filter right now.</div>`;
                return;
            }

            // Sort: Live (in) -> Upcoming (pre) -> Finished (post)
            events.sort((a, b) => {
                const getPriority = (event) => {
                    const state = event.competitions[0].status.type.state;
                    if (state === 'in') return 1;
                    if (state === 'pre') return 2;
                    return 3;
                };
                return getPriority(a) - getPriority(b);
            });

            let gridHTML = '<div class="games-grid">';

            events.forEach(event => {
                const competition = event.competitions[0];
                const statusType = competition.status.type.state;
                const statusDetail = competition.status.type.detail;
                
                const homeTeam = competition.competitors.find(t => t.homeAway === 'home');
                const awayTeam = competition.competitors.find(t => t.homeAway === 'away');

                let statusBadge = '';
                if (statusType === 'in') {
                    statusBadge = `<div class="status-live"><span class="pulse-dot"></span> LIVE • ${statusDetail}</div>`;
                } else if (statusType === 'post') {
                    statusBadge = `<div class="status-final">Final</div>`;
                } else {
                    statusBadge = `<div class="status-scheduled">${statusDetail}</div>`;
                }

                gridHTML += `
                    <div class="game-card">
                        <div>
                            <div class="game-status-bar">
                                ${statusBadge}
                                <span>${event.season?.year || ''}</span>
                            </div>
                            <div class="teams-container">
                                <div class="team-row">
                                    <div class="team-info">
                                        <img class="team-logo" src="${awayTeam.team.logo || ''}" alt="" onerror="this.style.display='none'">
                                        <span class="team-name">${awayTeam.team.shortDisplayName || awayTeam.team.name}</span>
                                    </div>
                                    <span class="team-score">${statusType === 'pre' ? '-' : (awayTeam.score || '0')}</span>
                                </div>
                                <div class="team-row">
                                    <div class="team-info">
                                        <img class="team-logo" src="${homeTeam.team.logo || ''}" alt="" onerror="this.style.display='none'">
                                        <span class="team-name">${homeTeam.team.shortDisplayName || homeTeam.team.name}</span>
                                    </div>
                                    <span class="team-score">${statusType === 'pre' ? '-' : (homeTeam.score || '0')}</span>
                                </div>
                            </div>
                        </div>
                        <div class="card-footer">
                            ${event.name}
                        </div>
                    </div>
                `;
            });

            gridHTML += '</div>';
            contentArea.innerHTML = gridHTML;
        }

        function renderStandings(data, specificTitle) {
            const contentArea = document.getElementById('content-area');
            let html = '';

            const groups = data.children || data.standings || [];

            if (!groups || groups.length === 0) {
                contentArea.innerHTML = `<div class="no-data">Standings data not available.</div>`;
                return;
            }

            // Helper to process table rows from entries
            const buildTableHTML = (entries) => {
                let rows = '';
                entries.forEach(entry => {
                    const team = entry.team;
                    const stats = entry.stats || [];
                    const wins = stats.find(s => s.name === 'wins')?.displayValue || '-';
                    const losses = stats.find(s => s.name === 'losses')?.displayValue || '-';
                    const gb = stats.find(s => s.name === 'gamesBehind')?.displayValue || '-';

                    rows += `
                        <tr>
                            <td class="team-cell">
                                <img class="team-logo" src="${team.logos?.[0]?.href || team.logo || ''}" alt="" onerror="this.style.display='none'">
                                <span>${team.displayName || team.name}</span>
                            </td>
                            <td>${wins}</td>
                            <td>${losses}</td>
                            <td>${gb}</td>
                        </tr>
                    `;
                });
                return rows;
            };

            // Recursive function to locate and render groups/divisions
            const parseGroup = (group) => {
                const groupName = group.name || specificTitle || 'Standings';
                const entries = group.standings?.entries || group.entries;

                if (entries && entries.length > 0) {
                    if (specificTitle && groupName.toLowerCase() !== specificTitle.toLowerCase() && groups.length > 1) {
                        // If looking for a specific conference, try to match
                    }
                    html += `
                        <div class="standings-section">
                            <div class="standings-title">${groupName}</div>
                            <table class="standings-table">
                               <thead>
                                   <tr>
                                       <th>Team</th>
                                       <th>W</th>
                                       <th>L</th>
                                       <th>GB</th>
                                   </tr>
                               </thead>
                               <tbody>
                                   ${buildTableHTML(entries)}
                               </tbody>
                            </table>
                        </div>
                    `;
                }

                if (group.children) {
                    group.children.forEach(child => parseGroup(child));
                }
            };

            groups.forEach(g => parseGroup(g));

            contentArea.innerHTML = html || `<div class="no-data">No standings found for this selection.</div>`;
        }

        function renderRankings(data, targetType) {
            const contentArea = document.getElementById('content-area');
            const rankingsList = data.rankings || [];
            
            // Filter poll based on targetType (FBS vs FCS)
            let poll = rankingsList.find(p => {
                const name = (p.name || p.headline || '').toLowerCase();
                if (targetType === 'FCS') {
                    return name.includes('fcs') || name.includes('coaches') || p.type === 'fcs';
                } else {
                    return name.includes('ap') || name.includes('fbs') || p.type === 'ap';
                }
            }) || rankingsList[0];

            if (!poll || !poll.ranks) {
                contentArea.innerHTML = `<div class="no-data">${targetType} rankings currently unavailable.</div>`;
                return;
            }

            let html = `
                <div class="standings-section">
                    <div class="standings-title">Current Top 25 ${targetType} Rankings (${poll.name || 'Poll'})</div>
                    <table class="standings-table">
                       <thead>
                           <tr>
                               <th>Rank</th>
                               <th>Team</th>
                               <th>Record</th>
                           </tr>
                       </thead>
                       <tbody>
            `;

            poll.ranks.forEach(rank => {
                const team = rank.team;
                html += `
                    <tr>
                        <td style="font-weight: 700; width: 60px;">#${rank.current}</td>
                        <td class="team-cell">
                            <img class="team-logo" src="${team.logo || ''}" alt="" onerror="this.style.display='none'">
                            <span>${team.displayName || team.name}</span>
                        </td>
                        <td>${rank.recordSummary || '-'}</td>
                    </tr>
                `;
            });

            html += `
                       </tbody>
                    </table>
                </div>
            `;

            contentArea.innerHTML = html;
        }

        // Initial load
        switchLeague('nfl', document.querySelector('.tab-btn'));

        // Auto-refresh scores every 30 seconds if viewing scores
        setInterval(() => {
            if (!isShowingStandings && currentLeagueKey) {
                fetchScores();
            }
        }, 30000);
    </script>
</body>
</html>
