<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Big Dog Streams</title>
    <!-- Favicon link added below -->
    <link rel="icon" type="image/jpeg" href="IMG_0916.jpeg">
    <style>
        :root {
            --bg-primary: #0f172a;
            --bg-secondary: #1e293b;
            --bg-card: #1e293b;
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --accent: #38bdf8;
            --accent-hover: #0ea5e9;
            --border: #334155;
            --success: #22c55e;
            --danger: #ef4444;
            --live-pulse: #ef4444;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            background-color: var(--bg-secondary);
            border-bottom: 1px solid var(--border);
            padding: 10px 16px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .header-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: nowrap;
            gap: 10px;
        }

        h1 {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--text-primary);
        }

        .nav-tabs {
            display: flex;
            gap: 4px;
            flex-wrap: nowrap;
            overflow-x: visible;
            white-space: nowrap;
        }

        .tab-btn {
            background-color: var(--bg-primary);
            color: var(--text-secondary);
            border: 1px solid var(--border);
            padding: 5px 8px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.75rem;
            transition: all 0.2s ease;
        }

        .tab-btn:hover {
            color: var(--text-primary);
            border-color: var(--text-secondary);
        }

        .tab-btn.active {
            background-color: var(--accent);
            color: var(--bg-primary);
            border-color: var(--accent);
        }

        .tab-btn[onclick*="test"] {
            display: none !important;
        }

        .filter-bar {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
            visibility: hidden;
            opacity: 0;
            transition: opacity 0.2s ease;
            height: 0;
            overflow: hidden;
            margin-bottom: 0px;
        }

        .filter-bar.visible {
            visibility: visible;
            opacity: 1;
            height: auto;
            margin-bottom: 16px;
        }

        select {
            background-color: var(--bg-primary);
            color: var(--text-primary);
            border: 1px solid var(--border);
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 0.9rem;
            outline: none;
            cursor: pointer;
        }

        select.hidden {
            display: none;
        }

        .action-btn {
            background-color: transparent;
            color: var(--accent);
            border: 1px solid var(--accent);
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.9rem;
            transition: all 0.2s ease;
        }

        .action-btn:hover {
            background-color: var(--accent);
            color: var(--bg-primary);
        }

        .action-btn.standings-active {
            background-color: var(--accent);
            color: var(--bg-primary);
        }

        .secondary-btn {
            background-color: transparent;
            color: var(--text-secondary);
            border: 1px solid var(--border);
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.9rem;
            display: none;
            transition: all 0.2s ease;
        }

        .secondary-btn.visible {
            display: inline-block;
        }

        .secondary-btn:hover {
            border-color: var(--text-primary);
            color: var(--text-primary);
        }

        .secondary-btn.active {
            border-color: var(--accent);
            color: var(--accent);
        }

        main {
            flex: 1;
            padding: 16px 24px 24px 24px;
            max-width: 1400px;
            width: 100%;
            margin: 0 auto;
        }

        .loading, .error, .no-data {
            text-align: center;
            padding: 48px;
            color: var(--text-secondary);
            font-size: 1.1rem;
        }

        .error {
            color: var(--danger);
        }

        .games-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 16px;
        }

        .game-card {
            background-color: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 16px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            gap: 12px;
            transition: transform 0.2s ease, border-color 0.2s ease;
        }

        .game-card:hover {
            transform: translateY(-2px);
            border-color: var(--text-secondary);
        }

        .game-status-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.8rem;
            color: var(--text-secondary);
            margin-bottom: 8px;
        }

        .status-live {
            color: var(--danger);
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .pulse-dot {
            width: 8px;
            height: 8px;
            background-color: var(--danger);
            border-radius: 50%;
            display: inline-block;
            box-shadow: 0 0 0 rgba(239, 68, 68, 0.4);
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% {
                box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7);
            }
            70% {
                box-shadow: 0 0 0 6px rgba(239, 68, 68, 0);
            }
            100% {
                box-shadow: 0 0 0 0 rgba(239, 68, 68, 0);
            }
        }

        .status-final {
            color: var(--text-secondary);
            font-weight: 600;
        }

        .status-scheduled {
            color: var(--accent);
            font-weight: 600;
        }

        .teams-container {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .team-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .team-info {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .team-logo {
            width: 24px;
            height: 24px;
            object-fit: contain;
        }

        .team-name {
            font-size: 0.95rem;
            font-weight: 600;
        }

        .team-score {
            font-size: 1.1rem;
            font-weight: 700;
        }

        .card-footer {
            border-top: 1px solid var(--border);
            padding-top: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.75rem;
            color: var(--text-secondary);
        }

        .view-boxscore-hint {
            color: var(--accent);
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
        }

        .view-boxscore-hint:hover {
            text-decoration: underline;
        }

        .streams-dropdown {
            position: relative;
            display: inline-block;
        }

        .streams-btn {
            background-color: var(--bg-primary);
            color: var(--accent);
            border: 1px solid var(--border);
            padding: 4px 10px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
            font-weight: 600;
            transition: all 0.2s ease;
        }

        .streams-btn:hover {
            border-color: var(--accent);
        }

        .streams-content {
            display: none;
            position: absolute;
            bottom: 100%;
            left: 0;
            background-color: var(--bg-secondary);
            min-width: 200px;
            border: 1px solid var(--border);
            border-radius: 6px;
            box-shadow: 0px 8px 16px rgba(0,0,0,0.4);
            z-index: 50;
            margin-bottom: 4px;
            max-height: 200px;
            overflow-y: auto;
        }

        .streams-content a {
            color: var(--text-primary);
            padding: 8px 12px;
            text-decoration: none;
            display: block;
            font-size: 12px;
            border-bottom: 1px solid var(--border);
        }

        .streams-content a:hover {
            background-color: var(--bg-primary);
            color: var(--accent);
        }

        .streams-dropdown.active .streams-content {
            display: block;
        }

        /* Redzone Card styling specifically formatted like a game card */
        .redzone-card {
            background: linear-gradient(135deg, rgba(239, 68, 68, 0.15), rgba(30, 41, 59, 0.9));
            border: 1px solid rgba(239, 68, 68, 0.4);
            border-radius: 8px;
            padding: 12px 16px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            gap: 8px;
            transition: transform 0.2s ease, border-color 0.2s ease;
        }

        .redzone-card:hover {
            transform: translateY(-2px);
            border-color: var(--danger);
        }

        .redzone-card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.8rem;
            color: var(--text-secondary);
            margin-bottom: 4px;
        }

        .redzone-card-title-row {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .standings-section {
            background-color: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 8px;
            overflow: hidden;
            margin-bottom: 24px;
        }

        .standings-title {
            background-color: rgba(255, 255, 255, 0.02);
            padding: 14px 20px;
            font-size: 1rem;
            font-weight: 700;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .table-responsive {
            width: 100%;
            overflow-x: auto;
        }

        .standings-table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
            font-size: 0.9rem;
        }

        .standings-table th, .standings-table td {
            padding: 7px 16px;
            border-bottom: 1px solid var(--border);
        }

        .standings-table th {
            color: var(--text-secondary);
            font-weight: 600;
            background-color: rgba(0, 0, 0, 0.1);
        }

        .standings-table tr:last-child td {
            border-bottom: none;
        }

        .team-cell {
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 600;
        }

        .boxscore-header {
            margin-bottom: 12px;
        }

        .back-btn {
            background-color: transparent;
            color: var(--text-secondary);
            border: 1px solid var(--border);
            padding: 5px 10px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: 600;
            transition: all 0.2s ease;
        }

        .back-btn:hover {
            color: var(--text-primary);
            border-color: var(--text-primary);
        }

        .boxscore-matchup-card {
            background-color: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 10px 16px;
            display: flex;
            flex-direction: column;
            gap: 4px;
            margin-bottom: 16px;
        }

        .boxscore-game-info {
            text-align: center;
            font-size: 0.7rem;
            color: var(--text-secondary);
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .boxscore-teams-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .boxscore-team {
            display: flex;
            align-items: center;
            gap: 8px;
            flex: 1;
        }

        .boxscore-team.right {
            justify-content: flex-end;
            text-align: right;
        }

        .boxscore-team img {
            width: 26px;
            height: 26px;
            object-fit: contain;
        }

        .boxscore-team-name {
            font-size: 0.95rem;
            font-weight: 700;
        }

        .boxscore-score {
            font-size: 1.3rem;
            font-weight: 800;
            padding: 0 12px;
        }

        .comparison-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.85rem;
            white-space: nowrap;
        }

        .comparison-table td, .comparison-table th {
            padding: 5px 12px;
            border-bottom: 1px solid var(--border);
        }

        .comparison-table th {
            color: var(--text-secondary);
            font-weight: 600;
            background-color: rgba(0, 0, 0, 0.1);
        }

        .comparison-table tr:last-child td {
            border-bottom: none;
        }

        .player-stats-table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
            white-space: nowrap;
        }

        .player-stats-table th, .player-stats-table td {
            padding: 6px 12px;
            font-size: 0.85rem;
            border-bottom: 1px solid var(--border);
        }

        .player-stats-table th {
            color: var(--text-secondary);
            font-weight: 600;
            background-color: rgba(0, 0, 0, 0.1);
        }

        .player-stats-table tr:last-child td {
            border-bottom: none;
        }

        .player-stats-table th:first-child,
        .player-stats-table td:first-child {
            width: 42%;
            text-align: left;
        }

        .player-stats-table th:nth-child(2),
        .player-stats-table td:nth-child(2) {
            min-width: 65px;
            text-align: center;
        }

        .player-stats-table th:nth-child(n+3),
        .player-stats-table td:nth-child(n+3) {
            text-align: center;
        }

        .link-badge {
            color: var(--accent);
            text-decoration: none;
            font-weight: 600;
        }

        .link-badge:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <header>
        <div class="header-top">
            <a href="https://avety7.github.io/BigDogStreams/" style="display: inline-block; text-decoration: none;">
                <img src="IMG_0905.jpeg" alt="Big Dog Streams Logo" style="max-height: 38px; width: auto; vertical-align: middle;">
            </a>
            <div class="nav-tabs">
                <button class="tab-btn active" onclick="switchLeague('nfl', this)">NFL</button>
                <button class="tab-btn" onclick="switchLeague('nba', this)">NBA</button>
                <button class="tab-btn" onclick="switchLeague('mlb', this)">MLB</button>
                <button class="tab-btn" onclick="switchLeague('cfb', this)">CFB</button>
                <button class="tab-btn" onclick="switchLeague('cbb', this)">CBB</button>
                <button class="tab-btn" onclick="switchLeague('test', this)">Test</button>
            </div>
        </div>
    </header>

    <main id="content-area">
        <div class="filter-bar" id="filter-container">
            <select id="conference-select" class="hidden" onchange="handleFilterChange()"></select>
            <button class="action-btn" id="standings-toggle-btn" onclick="toggleStandingsView()">View Standings</button>
            <button class="secondary-btn" id="secondary-standings-btn" onclick="toggleWildCardView()">View Wild Card</button>
        </div>
    </main>

    <script>
        const endpoints = {
            nfl: { sport: 'football', league: 'nfl', type: 'pro', conferences: null },
            nba: { sport: 'basketball', league: 'nba', type: 'pro', conferences: null },
            mlb: { sport: 'baseball', league: 'mlb', type: 'pro', conferences: null },
            cfb: { 
                sport: 'football', 
                league: 'college-football', 
                type: 'college',
                conferences: [
                    { name: 'All FBS', param: '?groups=80', type: 'rankings-fbs' },
                    { name: 'FCS', param: '?groups=81', type: 'rankings-fcs' },
                    { name: 'SEC', param: '?groups=8', type: 'standings' },
                    { name: 'Big Ten', param: '?groups=5', type: 'standings' },
                    { name: 'Big 12', param: '?groups=1', type: 'standings' },
                    { name: 'ACC', param: '?groups=151', type: 'standings' },
                    { name: 'American Athletic', param: '?groups=151', type: 'standings' },
                    { name: 'Mountain West', param: '?groups=17', type: 'standings' },
                    { name: 'PAC-12', param: '?groups=9', type: 'standings' },
                    { name: 'MAC', param: '?groups=15', type: 'standings' },
                    { name: 'Sun Belt', param: '?groups=37', type: 'standings' },
                    { name: 'Conference USA', param: '?groups=12', type: 'standings' },
                    { name: 'FBS Independents', param: '?groups=112', type: 'standings' }
                ]
            },
            cbb: { 
                sport: 'basketball', 
                league: 'mens-college-basketball', 
                type: 'college',
                conferences: [
                    { name: 'All Top Tier (Div I)', param: '?groups=50', type: 'rankings-fbs' },
                    { name: 'SEC', param: '?groups=23', type: 'standings' },
                    { name: 'Big Ten', param: '?groups=7', type: 'standings' },
                    { name: 'Big 12', param: '?groups=8', type: 'standings' },
                    { name: 'ACC', param: '?groups=2', type: 'standings' },
                    { name: 'Big East', param: '?groups=4', type: 'standings' }
                ]
            },
            test: {
                type: 'test',
                conferences: null
            }
        };

        let currentLeagueKey = 'nfl';
        let isShowingStandings = false;
        let isShowingWildCard = false;
        let currentView = 'hub';
        let cachedEvents = [];
        let allFetchedGames = {}; 
        let globalBoxScoreData = null;
        let availableLinks = [];

        async function loadLinksJson() {
            try {
                const response = await fetch('links.json?t=' + Date.now());
                if (response.ok) {
                    const data = await response.json();
                    if (data && data.links) {
                        availableLinks = data.links;
                    }
                }
            } catch (err) {
                console.warn('Could not load links.json:', err);
                availableLinks = testJsonData.links || [];
            }
        }

        let testJsonData = {
            "links": [
                {
                    "source_site": "https://mybuffstreams.plus/mlb-live-streams",
                    "text": "San Diego PadresIn ProgressMiami MarlinsLive Streams",
                    "href": "https://mybuffstreams.plus/mlb/miami-marlins-san-diego-padres/1376015"
                },
                {
                    "source_site": "https://mybuffstreams.plus/mlb-live-streams",
                    "text": "Los Angeles DodgersIn ProgressSan Francisco GiantsLive Streams",
                    "href": "https://mybuffstreams.plus/mlb/los-angeles-dodgers-san-francisco-giants/1376016"
                },
                {
                    "source_site": "https://mybuffstreams.plus/mlb-live-streams",
                    "text": "Los Angeles AngelsIn ProgressMinnesota TwinsLive Streams",
                    "href": "https://mybuffstreams.plus/mlb/los-angeles-angels-minnesota-twins/1376017"
                }
            ]
        };

        function formatPlayerName(fullName) {
            if (!fullName) return '';
            const parts = fullName.trim().split(/\s+/);
            if (parts.length === 1) return parts[0];
            const firstName = parts[0];
            const lastName = parts.slice(1).join(' ');
            return `${firstName.charAt(0)}. ${lastName}`;
        }

        async function backgroundPrefetch() {
            await loadLinksJson();
            const leagueKeys = ['nfl', 'nba', 'mlb', 'cbb'];
            for (let lKey of leagueKeys) {
                const cfg = endpoints[lKey];
                let queryParam = cfg.conferences ? cfg.conferences[0].param : '';
                const url = `https://site.api.espn.com/apis/site/v2/sports/${cfg.sport}/${cfg.league}/scoreboard${queryParam}`;
                try {
                    const res = await fetch(url);
                    const data = await res.json();
                    if (data.events) {
                        allFetchedGames[lKey] = data.events;
                    }
                } catch (e) {}
            }

            const cfbCfg = endpoints['cfb'];
            let combinedCfbEvents = [];
            const cfbGroups = ['?groups=80', '?groups=81'];
            
            for (let param of cfbGroups) {
                const url = `https://site.api.espn.com/apis/site/v2/sports/${cfbCfg.sport}/${cfbCfg.league}/scoreboard${param}`;
                try {
                    const res = await fetch(url);
                    const data = await res.json();
                    if (data.events) {
                        combinedCfbEvents = combinedCfbEvents.concat(data.events);
                    }
                } catch (e) {}
            }

            const uniqueMap = new Map();
            combinedCfbEvents.forEach(ev => uniqueMap.set(ev.id, ev));
            allFetchedGames['cfb'] = Array.from(uniqueMap.values());
        }

        function getActiveContentContainer() {
            let container = document.getElementById('dynamic-content-area');
            if (!container) {
                const mainArea = document.getElementById('content-area');
                container = document.createElement('div');
                container.id = 'dynamic-content-area';
                mainArea.appendChild(container);
            }
            return container;
        }

        async function loadData() {
            currentView = 'hub';
            const dynamicArea = getActiveContentContainer();
            
            if (currentLeagueKey === 'test') {
                renderTestTab();
                return;
            }

            dynamicArea.innerHTML = '<div class="loading">Loading...</div>';

            if (isShowingStandings) {
                if (isShowingWildCard && currentLeagueKey === 'mlb') {
                    await fetchMLBWildCardStandings();
                } else {
                    await fetchStandings();
                }
            } else {
                await fetchScores();
            }
        }

        function cleanMatchupText(text) {
            return text
                .replace(/live\s*streams/gi, '')
                .replace(/in\s*progress/gi, '')
                .replace(/halftime/gi, '')
                .replace(/\d+(?:st|nd|rd|th)\s*quarter/gi, '')
                .replace(/\d+(?:st|nd|rd|th)\s*half/gi, '')
                .replace(/\d{1,2}:\d{2}\s*(?:am|pm)?/gi, '')
                .toLowerCase()
                .trim();
        }

        function determineMatchedLeague(row) {
            const source = (row.source_site || '').toLowerCase();
            const href = (row.href || '').toLowerCase();
            
            if (source.includes('mlb') || href.includes('/mlb/')) return 'MLB';
            if (source.includes('nba') || href.includes('/nba/')) return 'NBA';
            if (source.includes('nfl') || href.includes('/nfl/')) return 'NFL';
            if (source.includes('cfb') || href.includes('/cfb/')) return 'CFB';
            if (source.includes('ncaa') || source.includes('cbb') || href.includes('/cbb/') || href.includes('/ncaa/')) return 'CBB';
            
            return 'Unknown';
        }

        function findBestMatch(rowText, sourceSite) {
            let lowerRowText = rowText.toLowerCase();

            if (lowerRowText.includes('manningcast')) {
                return `<span style="color: var(--text-primary); font-weight: 500;">Manningcast</span>`;
            }

            if (lowerRowText.includes('redzone')) {
                return `<span style="color: var(--text-primary); font-weight: 500;">Redzone</span>`;
            }

            let targetLeagues = [];
            
            if (sourceSite.includes('mlb')) {
                targetLeagues = ['mlb'];
            } else if (sourceSite.includes('nflstreams')) {
                targetLeagues = ['cfb', 'nfl'];
            } else {
                targetLeagues = Object.keys(allFetchedGames);
            }

            let allGamesList = [];
            targetLeagues.forEach(lKey => {
                if (allFetchedGames[lKey]) {
                    allGamesList = allGamesList.concat(allFetchedGames[lKey]);
                }
            });

            if (allGamesList.length === 0) return '<span style="color: var(--text-secondary);">NA</span>';

            let cleanedText = cleanMatchupText(rowText);

            let bestMatch = null;
            let foundExactPair = false;

            for (let event of allGamesList) {
                const comp = event.competitions?.[0];
                if (!comp || !comp.competitors) continue;

                const awayTeam = comp.competitors.find(t => t.homeAway === 'away')?.team;
                const homeTeam = comp.competitors.find(t => t.homeAway === 'home')?.team;
                if (!awayTeam || !homeTeam) continue;

                const awayNames = [
                    (awayTeam?.displayName || '').toLowerCase(),
                    (awayTeam?.name || '').toLowerCase(),
                    (awayTeam?.shortDisplayName || '').toLowerCase(),
                    (awayTeam?.location || '').toLowerCase()
                ].filter(n => n.length > 2);

                const homeNames = [
                    (homeTeam?.displayName || '').toLowerCase(),
                    (homeTeam?.name || '').toLowerCase(),
                    (homeTeam?.shortDisplayName || '').toLowerCase(),
                    (homeTeam?.location || '').toLowerCase()
                ].filter(n => n.length > 2);

                let awayFound = awayNames.some(n => cleanedText.includes(n));
                let homeFound = homeNames.some(n => cleanedText.includes(n));

                if (awayFound && homeFound) {
                    bestMatch = `${awayTeam.shortDisplayName || awayTeam.name} @ ${homeTeam.shortDisplayName || homeTeam.name}`;
                    foundExactPair = true;
                    break;
                }
            }

            if (foundExactPair && bestMatch) {
                return `<span style="color: var(--text-primary); font-weight: 500;">${bestMatch}</span>`;
            }

            return `<span style="color: var(--text-secondary);">NA</span>`;
        }

        function getProviderName(urlStr) {
            try {
                const urlObj = new URL(urlStr);
                let host = urlObj.hostname.replace('www.', '');
                let parts = host.split('.');
                if (parts.length >= 2) {
                    let mainName = parts[parts.length - 2];
                    return mainName.charAt(0).toUpperCase() + mainName.slice(1);
                }
                return host;
            } catch (e) {
                return "Stream";
            }
        }

        function renderMLBWildCard(data) {
            const dynamicArea = getActiveContentContainer();
            let html = '';
            let leagues = [];

            function extractLeagues(node) {
                if (!node) return;
                if (node.children) {
                    node.children.forEach(child => {
                        if (child.children && child.children.some(c => c.standings)) {
                            leagues.push(child);
                        } else {
                            extractLeagues(child);
                        }
                    });
                }
            }

            extractLeagues(data);
            if (leagues.length === 0 && data.children) {
                leagues = data.children;
            }

            if (leagues.length === 0) {
                dynamicArea.innerHTML = `<div class="no-data">No Wild Card standings available.</div>`;
                return;
            }

            leagues.forEach(league => {
                const leagueName = league.name || 'Wild Card';
                let wildcardEntries = [];

                let divisions = [];
                function findDivisions(node) {
                    if (!node) return;
                    if (node.standings && node.standings.entries) {
                        divisions.push(node.standings.entries);
                    }
                    if (node.children) {
                        node.children.forEach(child => findDivisions(child));
                    }
                }
                findDivisions(league);

                divisions.forEach(divEntries => {
                    let sortedDiv = [...divEntries].sort((a, b) => {
                        const aStats = a.stats || [];
                        const bStats = b.stats || [];
                        const aWins = parseInt(aStats.find(s => s.name === 'wins')?.value ?? aStats.find(s => s.name === 'wins')?.displayValue ?? 0);
                        const bWins = parseInt(bStats.find(s => s.name === 'wins')?.value ?? bStats.find(s => s.name === 'wins')?.displayValue ?? 0);
                        const aLosses = parseInt(aStats.find(s => s.name === 'losses')?.value ?? aStats.find(s => s.name === 'losses')?.displayValue ?? 0);
                        const bLosses = parseInt(bStats.find(s => s.name === 'losses')?.value ?? bStats.find(s => s.name === 'losses')?.displayValue ?? 0);
                        
                        if (bWins !== aWins) return bWins - aWins;
                        return aLosses - bLosses;
                    });

                    if (sortedDiv.length > 0) {
                        sortedDiv.shift();
                    }
                    wildcardEntries = wildcardEntries.concat(sortedDiv);
                });

                if (wildcardEntries.length === 0) return;

                wildcardEntries.sort((a, b) => {
                    const aStats = a.stats || [];
                    const bStats = b.stats || [];
                    const aWins = parseInt(aStats.find(s => s.name === 'wins')?.value ?? aStats.find(s => s.name === 'wins')?.displayValue ?? 0);
                    const bWins = parseInt(bStats.find(s => s.name === 'wins')?.value ?? bStats.find(s => s.name === 'wins')?.displayValue ?? 0);
                    const aLosses = parseInt(aStats.find(s => s.name === 'losses')?.value ?? aStats.find(s => s.name === 'losses')?.displayValue ?? 0);
                    const bLosses = parseInt(bStats.find(s => s.name === 'losses')?.value ?? bStats.find(s => s.name === 'losses')?.displayValue ?? 0);
                    
                    if (bWins !== aWins) return bWins - aWins;
                    return aLosses - bLosses;
                });

                const baselineTeam = wildcardEntries[2] || wildcardEntries[wildcardEntries.length - 1];
                let baseWins = 0;
                let baseLosses = 0;

                if (baselineTeam) {
                    const bStats = baselineTeam.stats || [];
                    baseWins = parseInt(bStats.find(s => s.name === 'wins')?.value ?? bStats.find(s => s.name === 'wins')?.displayValue ?? 0);
                    baseLosses = parseInt(bStats.find(s => s.name === 'losses')?.value ?? bStats.find(s => s.name === 'losses')?.displayValue ?? 0);
                }

                html += `
                    <div class="standings-section">
                        <div class="standings-title">${leagueName} Wild Card</div>
                        <table class="standings-table">
                           <thead>
                               <tr>
                                   <th>Team</th>
                                   <th>W</th>
                                   <th>L</th>
                                   <th>GB</th>
                               </tr>
                           </thead>
                           <tbody>
                `;

                wildcardEntries.forEach((entry, idx) => {
                    const team = entry.team || {};
                    const stats = entry.stats || [];
                    const wins = parseInt(stats.find(s => s.name === 'wins')?.value ?? stats.find(s => s.name === 'wins')?.displayValue ?? 0);
                    const losses = parseInt(stats.find(s => s.name === 'losses')?.value ?? stats.find(s => s.name === 'losses')?.displayValue ?? 0);

                    let gbDisplay = '-';
                    if (baselineTeam) {
                        const gbVal = ((baseWins - wins) + (losses - baseLosses)) / 2;
                        if (idx === 2) {
                            gbDisplay = '-';
                        } else if (gbVal === 0) {
                            gbDisplay = '-';
                        } else if (gbVal > 0) {
                            gbDisplay = gbVal % 1 === 0 ? gbVal.toString() : gbVal.toFixed(1);
                        } else {
                            gbDisplay = '+' + (gbVal % 1 === 0 ? Math.abs(gbVal).toString() : Math.abs(gbVal).toFixed(1));
                        }
                    }

                    const teamLogo = team.logo || (team.logos && team.logos[0] && team.logos[0].href) || '';
                    const teamName = team.displayName || team.name || team.shortDisplayName || '';

                    html += `
                        <tr>
                            <td class="team-cell">
                                <img class="team-logo" src="${teamLogo}" alt="" onerror="this.style.display='none'">
                                <span>${teamName}</span>
                            </td>
                            <td>${wins}</td>
                            <td>${losses}</td>
                            <td>${gbDisplay}</td>
                        </tr>
                    `;
                });

                html += `</tbody></table></div>`;
            });

            dynamicArea.innerHTML = html;
        }

            const homeTeam = competitors.find(c => c.homeAway === 'home');

            const statusDetail = competition.status?.type?.detail || '';

            let html = `
                <div class="boxscore-header">
                    <button class="back-btn" onclick="loadData()">← Back to Scores</button>
                </div>
                <div class="boxscore-matchup-card">
                    <div class="boxscore-game-info">${competition.status?.type?.description || 'Matchup'} • ${statusDetail}</div>

                const homeStats = data.boxscore.teams.find(t => t.team.id === homeTeam.id)?.statistics || [];

                const hasValidStats = awayStats.length > 0 && awayStats.some(s => s.label && s.displayValue !== undefined);

                if (hasValidStats) {
                    const statMap = new Map();
                    
                    awayStats.forEach(s => {
                        const key = (s.name || s.label || '').toLowerCase().trim();
                        statMap.set(key, { away: s.displayValue, label: s.label, name: s.name });
                    });
                    
                    homeStats.forEach(s => {
                        const key = (s.name || s.label || '').toLowerCase().trim();

                            statMap.delete(k);

                        { obj: redzoneObj, label: 'Redzone' },
                        { obj: penaltiesObj, label: 'Penalties' },

                                            <th style="width: 30%; text-align: right;">${homeTeam.team?.shortDisplayName || 'Home'}</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                    `;

                    configuredOrder.forEach(item => {
                        if (item.obj) {

                            const homeVal = item.obj.home !== undefined ? item.obj.home : '-';

            }

            dynamicArea.innerHTML = html;
            if (data.boxscore && data.boxscore.players && data.boxscore.players.length > 0) {
                renderPlayerStatsForTeam(data.boxscore.players[0].team.id);
            }
        }

        function handlePlayerTeamChange() {
            const selectEl = document.getElementById('player-team-select');
            if (selectEl) {
                renderPlayerStatsForTeam(selectEl.value);
            }
        }

        function renderPlayerStatsForTeam(teamId) {
            const container = document.getElementById('player-stats-container');
            if (!container || !globalBoxScoreData || !globalBoxScoreData.boxscore || !globalBoxScoreData.boxscore.players) return;

            const pTeam = globalBoxScoreData.boxscore.players.find(t => t.team.id === teamId);
            if (!pTeam) {
                container.innerHTML = '';
                return;
            }

            const teamDisplayName = pTeam.team.shortDisplayName || pTeam.team.displayName || 'Team';
            let html = `<div class="standings-section" style="margin-bottom: 16px;">`;

            if (pTeam.statistics) {
                pTeam.statistics.forEach(category => {
                    const rawCatName = (category.displayName || category.name || category.text || '').trim();
                    const capitalizedCatName = rawCatName ? rawCatName.charAt(0).toUpperCase() + rawCatName.slice(1).toLowerCase() : 'Statistics';
                    
                    let categoryTitle = `${teamDisplayName} ${capitalizedCatName}`;

                    html += `<div style="margin-top: 14px; margin-left: 12px; font-size: 0.9rem; font-weight: 700; color: var(--accent);">${categoryTitle}</div>`;
                    html += `<div class="table-responsive"><table class="player-stats-table" style="margin-top: 6px;"><thead><tr>`;
                    
                    html += `<th>Player</th>`;

                    if (category.labels) {
                        category.labels.forEach(lbl => {
                            html += `<th>${lbl}</th>`;
                        });
                    }
                    html += `</tr></thead><tbody>`;

                    if (category.athletes) {
                        category.athletes.forEach(ath => {
                            const shortName = formatPlayerName(ath.athlete.displayName);
                            html += `<tr>`;
                            html += `<td>${shortName}</td>`;
                            if (ath.stats) {
                                ath.stats.forEach(st => {
                                    html += `<td>${st}</td>`;
                                });
                            }
                            html += `</tr>`;
                        });
                    }
                    html += `</tbody></table></div>`;
                });
            }
            html += `</div>`;
            container.innerHTML = html;
        }

        function switchLeague(leagueKey, buttonElement) {
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            buttonElement.classList.add('active');

            currentLeagueKey = leagueKey;
            isShowingStandings = false;
            isShowingWildCard = false;

            const cfg = endpoints[leagueKey];
            const filterContainer = document.getElementById('filter-container');
            const conferenceSelect = document.getElementById('conference-select');

            if (leagueKey === 'test') {
                filterContainer.classList.remove('visible');
                loadData();
                return;
            }

            filterContainer.classList.add('visible');

            if (cfg.conferences) {
                conferenceSelect.classList.remove('hidden');
                conferenceSelect.innerHTML = '';
                cfg.conferences.forEach(conf => {
                    const option = document.createElement('option');
                    option.value = conf.param;
                    option.textContent = conf.name;
                    conferenceSelect.appendChild(option);
                });
            } else {
                conferenceSelect.classList.add('hidden');
            }

            updateStandingsButtonState();
            loadData();
        }

        function handleFilterChange() {
            isShowingStandings = false;
            isShowingWildCard = false;
            updateStandingsButtonState();
            loadData();
        }

        function toggleStandingsView() {
            isShowingStandings = !isShowingStandings;
            if (!isShowingStandings) {
                isShowingWildCard = false;
            }
            updateStandingsButtonState();
            loadData();
        }

        function toggleWildCardView() {
            isShowingWildCard = !isShowingWildCard;
            updateStandingsButtonState();
            loadData();
        }

        function updateStandingsButtonState() {
            const btn = document.getElementById('standings-toggle-btn');
            const secondaryBtn = document.getElementById('secondary-standings-btn');
            const cfg = endpoints[currentLeagueKey];
            
            if (isShowingStandings) {
                btn.textContent = 'View Scores';
                btn.classList.add('standings-active');

                if (currentLeagueKey === 'mlb') {
                    secondaryBtn.classList.add('visible');
                    if (isShowingWildCard) {
                        secondaryBtn.textContent = 'View Division';
                        secondaryBtn.classList.add('active');
                    } else {
                        secondaryBtn.textContent = 'View Wild Card';
                        secondaryBtn.classList.remove('active');
                    }
                } else {
                    secondaryBtn.classList.remove('visible');
                    secondaryBtn.classList.remove('active');
                }
            } else {
                btn.classList.remove('standings-active');
                secondaryBtn.classList.remove('visible');
                secondaryBtn.classList.remove('active');
                isShowingWildCard = false;

                if (cfg && cfg.conferences) {
                    const conferenceSelect = document.getElementById('conference-select');
                    const selectedConf = cfg.conferences[conferenceSelect.selectedIndex];
                    if (selectedConf && (selectedConf.type === 'rankings-fbs' || selectedConf.type === 'rankings-fcs')) {
                        btn.textContent = 'View Top 25';
                    } else {
                        btn.textContent = 'View Standings';
                    }
                } else {
                    btn.textContent = 'View Standings';
                }
            }
        }

        function renderGames(events) {
            const dynamicArea = getActiveContentContainer();

            let gridHTML = '<div class="games-grid">';

            // If we are on the NFL tab, insert Redzone card(s) first in the grid
            if (currentLeagueKey === 'nfl') {
                const redzoneLinks = getRedzoneLinks();
                if (redzoneLinks.length > 0) {
                    const providerCounts = {};
                    redzoneLinks.forEach(link => {
                        const sourceRef = link.source_site || link.href;
                        const pName = getProviderName(sourceRef);
                        providerCounts[pName] = (providerCounts[pName] || 0) + 1;
                    });

                    const providerSeenIndices = {};

                    redzoneLinks.forEach(link => {
                        const sourceRef = link.source_site || link.href;
                        const pName = getProviderName(sourceRef);
                        
                        let label = pName;
                        if (providerCounts[pName] > 1) {
                            providerSeenIndices[pName] = (providerSeenIndices[pName] || 0) + 1;
                            label = `${pName} ${providerSeenIndices[pName]}`;
                        } else if (redzoneLinks.length === 1) {
                            label = 'Redzone Stream';
                        }

                        gridHTML += `
                            <div class="redzone-card">
                                <div>
                                    <div class="redzone-card-header">
                                        <div class="status-live"><span class="pulse-dot"></span> LIVE • Redzone Feed</div>
                                    </div>
                                    <div class="redzone-card-title-row" style="margin-top: 4px; margin-bottom: 2px;">
                                        <div style="font-size: 1.1rem; font-weight: 700; color: var(--text-primary);">NFL Redzone (${label})</div>
                                    </div>
                                </div>
                                <div class="card-footer" style="margin-top: 8px;">
                                    <span style="font-size: 0.8rem; color: var(--text-secondary);">Source: ${pName}</span>
                                    <a class="link-badge" href="${link.href}" target="_blank">Watch Redzone →</a>
                                </div>
                            </div>
                        `;
                    });
                }
            }

            if (!events || events.length === 0) {
                if (currentLeagueKey !== 'nfl' || getRedzoneLinks().length === 0) {
                    dynamicArea.innerHTML = `<div class="no-data">No games scheduled or available for this filter right now.</div>`;
                    return;
                }
            } else {
                events.sort((a, b) => {
                    const getPriority = (event) => {
                        const state = event.competitions[0].status.type.state;
                        if (state === 'in') return 1;
                        if (state === 'pre') return 2;
                        return 3;
                    };
                    return getPriority(a) - getPriority(b);
                });

                events.forEach(event => {
                    const competition = event.competitions[0];
                    const statusType = competition.status.type.state;
                    const statusDetail = competition.status.type.detail;
                    
                    const homeTeam = competition.competitors.find(t => t.homeAway === 'home');
                    const awayTeam = competition.competitors.find(t => t.homeAway === 'away');

                    let statusBadge = '';
                    if (statusType === 'in') {
                        statusBadge = `<div class="status-live"><span class="pulse-dot"></span> LIVE • ${statusDetail}</div>`;
                    } else if (statusType === 'post') {
                        statusBadge = `<div class="status-final">Final</div>`;
                    } else {
                        statusBadge = `<div class="status-scheduled">${statusDetail}</div>`;
                    }

                    const homeTeamName = homeTeam.team.shortDisplayName || homeTeam.team.name;
                    const awayTeamName = awayTeam.team.shortDisplayName || awayTeam.team.name;

                    gridHTML += `
                        <div class="game-card">
                            <div>
                                <div class="game-status-bar">
                                    ${statusBadge}
                                </div>
                                <div class="teams-container">
                                    <div class="team-row">
                                        <div class="team-info">
                                            <img class="team-logo" src="${awayTeam.team.logo || ''}" alt="" onerror="this.style.display='none'">
                                            <span class="team-name">${awayTeamName}</span>
                                        </div>
                                        <span class="team-score">${statusType === 'pre' ? '-' : (awayTeam.score || '0')}</span>
                                    </div>
                                    <div class="team-row">
                                        <div class="team-info">
                                            <img class="team-logo" src="${homeTeam.team.logo || ''}" alt="" onerror="this.style.display='none'">
                                            <span class="team-name">${homeTeamName}</span>
                                        </div>
                                        <span class="team-score">${statusType === 'pre' ? '-' : (homeTeam.score || '0')}</span>
                                    </div>
                                </div>
                            </div>
                            <div class="card-footer">
                                ${createStreamsDropdown(homeTeam.team, awayTeam.team)}
                                <span class="view-boxscore-hint" onclick="openBoxScore('${event.id}')">Box Score →</span>
                            </div>
                        </div>
                    `;
                });
            }

            gridHTML += '</div>';
            dynamicArea.innerHTML = gridHTML;
        }

        function renderProStandings(data) {
            const dynamicArea = getActiveContentContainer();
            let html = '';
            let divisions = [];
            
            function extractDivisions(node) {
                if (!node) return;
                if (node.standings && node.standings.entries) {
                    divisions.push({ name: node.name || 'Division', entries: node.standings.entries });
                }
                if (node.entries) {
                    divisions.push({ name: node.name || 'Division', entries: node.entries });
                }
                if (node.children) {
                    node.children.forEach(child => extractDivisions(child));
                }
            }

            if (data.children) {
                data.children.forEach(child => extractDivisions(child));
            } else if (data.standings) {
                extractDivisions(data);
            }

            if (divisions.length === 0) {
                dynamicArea.innerHTML = `<div class="no-data">No pro standings available.</div>`;
                return;
            }

            divisions.forEach(div => {
                div.entries.sort((a, b) => {
                    const aStats = a.stats || [];
                    const bStats = b.stats || [];
                    const aWins = parseInt(aStats.find(s => s.name === 'wins')?.value ?? aStats.find(s => s.name === 'wins')?.displayValue ?? 0);
                    const bWins = parseInt(bStats.find(s => s.name === 'wins')?.value ?? bStats.find(s => s.name === 'wins')?.displayValue ?? 0);
                    const aLosses = parseInt(aStats.find(s => s.name === 'losses')?.value ?? aStats.find(s => s.name === 'losses')?.displayValue ?? 0);
                    const bLosses = parseInt(bStats.find(s => s.name === 'losses')?.value ?? bStats.find(s => s.name === 'losses')?.displayValue ?? 0);
                    
                    if (bWins !== aWins) return bWins - aWins;
                    return aLosses - bLosses;
                });

                html += `
                    <div class="standings-section">
                        <div class="standings-title">${div.name}</div>
                        <table class="standings-table">
                           <thead>
                               <tr>
                                   <th>Team</th>
                                   <th>W</th>
                                   <th>L</th>
                                   <th>GB</th>
                               </tr>
                           </thead>
                           <tbody>
                `;

                div.entries.forEach(entry => {
                    const team = entry.team || {};
                    const stats = entry.stats || [];
                    const wins = stats.find(s => s.name === 'wins')?.displayValue || '-';
                    const losses = stats.find(s => s.name === 'losses')?.displayValue || '-';
                    const gb = stats.find(s => s.name === 'gamesBehind')?.displayValue || '-';

                    const teamLogo = team.logo || (team.logos && team.logos[0] && team.logos[0].href) || '';
                    const teamName = team.displayName || team.name || team.shortDisplayName || '';

                    html += `
                        <tr>
                            <td class="team-cell">
                                <img class="team-logo" src="${teamLogo}" alt="" onerror="this.style.display='none'">
                                <span>${teamName}</span>
                            </td>
                            <td>${wins}</td>
                            <td>${losses}</td>
                            <td>${gb}</td>
                        </tr>
                    `;
                });

                html += `</tbody></table></div>`;
            });

            dynamicArea.innerHTML = html;
        }

        function renderFilteredCollegeStandings(data, confName, targetGroupId) {
            const dynamicArea = getActiveContentContainer();
            let matchedEntries = [];

            function findGroupEntries(node) {
                if (!node) return;
                
                const nodeId = node.id ? node.id.toString() : '';
                const nodeName = (node.shortName || node.name || '').toLowerCase();
                
                if ((targetGroupId && nodeId === targetGroupId) || nodeName === confName.toLowerCase()) {
                    if (node.standings && node.standings.entries) {
                        matchedEntries = node.standings.entries;
                        return;
                    } else if (node.entries) {
                        matchedEntries = node.entries;
                        return;
                    }
                }

                if (node.children) {
                    node.children.forEach(child => findGroupEntries(child));
                }
            }

            findGroupEntries(data);

            if (matchedEntries.length === 0 && data.groups) {
                const targetGroup = data.groups.find(g => (g.id && g.id.toString() === targetGroupId) || (g.name || '').toLowerCase() === confName.toLowerCase());
                if (targetGroup && targetGroup.standings && targetGroup.standings.entries) {
                    matchedEntries = targetGroup.standings.entries;
                }
            }

            if (matchedEntries.length === 0) {
                dynamicArea.innerHTML = `<div class="no-data">No standings available for ${confName}.</div>`;
                return;
            }

            let html = `
                <div class="standings-section">
                    <div class="standings-title">${confName} Standings</div>
                    <table class="standings-table">
                       <thead>
                           <tr>
                               <th>Team</th>
                               <th>Conf W-L</th>
                               <th>Overall W-L</th>
                           </tr>
                       </thead>
                       <tbody>
            `;

            matchedEntries.forEach(entry => {
                const team = entry.team || {};
                const stats = entry.stats || [];
                const confRecord = stats.find(s => s.name === 'conference' || s.abbreviation === 'CONF')?.displayValue || '-';
                const overallRecord = stats.find(s => s.name === 'overall' || s.abbreviation === 'OVERALL')?.displayValue || '-';

                const teamLogo = team.logo || (team.logos && team.logos[0] && team.logos[0].href) || '';
                const teamName = team.displayName || team.name || team.shortDisplayName || '';

                html += `
                    <tr>
                        <td class="team-cell">
                            <img class="team-logo" src="${teamLogo}" alt="" onerror="this.style.display='none'">
                            <span>${teamName}</span>
                        </td>
                        <td>${confRecord}</td>
                        <td>${overallRecord}</td>
                    </tr>
                `;
            });

            html += `</tbody></table></div>`;
            dynamicArea.innerHTML = html;
        }

        function renderCollegeRankings(data, targetType) {
            const dynamicArea = getActiveContentContainer();
            const rankingsList = data.rankings || [];
            
            let poll = rankingsList.find(p => {
                const name = (p.name || p.headline || '').toLowerCase();
                return name.includes('ap') || name.includes('fbs') || p.type === 'ap';
            }) || rankingsList[0];

            if (!poll || !poll.ranks) {
                dynamicArea.innerHTML = `<div class="no-data">Rankings currently unavailable.</div>`;
                return;
            }

            renderSpecificPoll(poll, `Current Top 25 ${targetType} Rankings (${poll.name || 'Poll'})`);
        }

        function renderSpecificPoll(poll, titleText) {
            const dynamicArea = getActiveContentContainer();
            let html = `
                <div class="standings-section">
                    <div class="standings-title">${titleText}</div>
                    <table class="standings-table">
                       <thead>
                           <tr>
                               <th>Rank</th>
                               <th>Team</th>
                               <th>Record</th>
                           </tr>
                     </thead>
                       </thead>
                       <tbody>
            `;

            poll.ranks.forEach(rank => {
                const team = rank.team || {};
                const teamLogo = team.logo || (team.logos && team.logos[0] && team.logos[0].href) || '';
                const teamName = team.displayName || team.name || team.shortDisplayName || '';

                html += `
                    <tr>
                        <td style="font-weight: 700; width: 60px;">#${rank.current}</td>
                        <td class="team-cell">
                            <img class="team-logo" src="${teamLogo}" alt="" onerror="this.style.display='none'">
                            <span>${teamName}</span>
                        </td>
                        <td>${rank.recordSummary || '-'}</td>
                    </tr>
                `;
            });

            html += `</tbody></table></div>`;
            dynamicArea.innerHTML = html;
        }

        backgroundPrefetch().then(() => {
            switchLeague('nfl', document.querySelector('.tab-btn'));
        });

        setInterval(() => {
            if (!isShowingStandings && currentLeagueKey && currentLeagueKey !== 'test' && currentView === 'hub') {
                fetchScores();
            }
        }, 30000);
    </script>
</body>
</html>
