<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sports Dashboard</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent: #38bdf8;
            --border: #334155;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 16px;
        }

        header {
            margin-bottom: 20px;
        }

        h1 {
            font-size: 1.5rem;
            margin: 0 0 12px 0;
        }

        /* Tabs Navigation */
        .tabs {
            display: flex;
            gap: 8px;
            border-bottom: 1px solid var(--border);
            padding-bottom: 8px;
            overflow-x: auto;
        }

        .tab-btn {
            background: transparent;
            border: none;
            color: var(--text-muted);
            padding: 8px 16px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            border-radius: 6px;
            transition: all 0.2s ease;
            white-space: nowrap;
        }

        .tab-btn.active {
            background-color: var(--accent);
            color: var(--bg-color);
        }

        /* Content Area */
        .content-container {
            margin-top: 20px;
        }

        .standings-section {
            background-color: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 16px;
        }

        .standings-title {
            font-size: 1.1rem;
            font-weight: 700;
            margin-bottom: 12px;
            color: var(--text-main);
        }
    </style>
</head>
<body>

    <header>
        <h1>Sports Dashboard</h1>
        <!-- Tabs Navigation -->
        <div class="tabs">
            <button class="tab-btn active" onclick="switchTab('nfl', event)">NFL</button>
            <button class="tab-btn" onclick="switchTab('nba', event)">NBA</button>
            <button class="tab-btn" onclick="switchTab('mlb', event)">MLB</button>
            <button class="tab-btn" onclick="switchTab('test', event)">Test</button>
        </div>
    </header>

    <main id="content-area" class="content-container">
        <!-- Default initial view -->
        <div class="standings-section">
            <div class="standings-title">NFL Dashboard</div>
            <div style="color: var(--text-muted);">Select a tab above to view content.</div>
        </div>
    </main>

    <script>
        function switchTab(tabName, event) {
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            if (event && event.target) {
                event.target.classList.add('active');
            }
            
            const contentArea = document.getElementById('content-area');
            
            if (tabName === 'test') {
                contentArea.innerHTML = `
                    <div class="standings-section">
                        <div class="standings-title">Test Tab</div>
                        <div style="color: var(--text-muted);">This tab is currently empty.</div>
                    </div>
                `;
            } else {
                contentArea.innerHTML = `
                    <div class="standings-section">
                        <div class="standings-title">${tabName.toUpperCase()} Dashboard</div>
                        <div style="color: var(--text-muted);">Content for ${tabName.toUpperCase()} goes here.</div>
                    </div>
                `;
            }
        }
    </script>
</body>
</html>
